# 数式の読み (role = "math_readings")
#
# 数式 (`x²-5x+b=0` / `sinθ=1/2` / `A∪B`) を読む時の、 関数名・ギリシャ文字・演算子の読み (カタカナ)。
# どの文字を数式の部品として認識するかは lib 側の規則で、 ここは **読み方だけ** を決める。
#
# このファイルが **正** で、 このファイルを読む lib は既定値を持たない。
# 古い lib (このファイルを知らない版) は読み飛ばし、 自前の同じ値で動く。
#
# 注意:
#   - 読みはカタカナ (と長音 ー) だけ。 1 つ 32 字まで、 各表は 500 件まで (validate が弾く)
#   - [functions] の key は小文字の英字。 前方一致で分けるので、 長い名前 (arcsin) が短い名前 (sin) より優先される
#     (lib が長い順に並べる。 ここでの並びは関係ない)
#   - 表に無い文字は 数式の部品として読まれない (読みが空になる)

[meta]
schema_version = "2"
role = "math_readings"
description = "数式の関数名・ギリシャ文字・演算子の読み"

# 関数名 (英字の小文字)
[functions]
arcsin = "アークサイン"
arccos = "アークコサイン"
arctan = "アークタンジェント"
sin = "サイン"
cos = "コサイン"
tan = "タンジェント"
log = "ログ"
exp = "エクスポネンシャル"
lim = "リミット"
max = "マックス"
min = "ミニマム"
ln = "エルエヌ"

# ギリシャ文字 (大文字と小文字は別の key。 同じ読みでも両方書く)
[greek]
"α" = "アルファ"
"β" = "ベータ"
"γ" = "ガンマ"
"δ" = "デルタ"
"Δ" = "デルタ"
"ε" = "イプシロン"
"θ" = "シータ"
"Θ" = "シータ"
"λ" = "ラムダ"
"Λ" = "ラムダ"
"μ" = "ミュー"
"π" = "パイ"
"Π" = "パイ"
"ρ" = "ロー"
"σ" = "シグマ"
"Σ" = "シグマ"
"τ" = "タウ"
"φ" = "ファイ"
"Φ" = "ファイ"
"ω" = "オメガ"
"Ω" = "オメガ"

# 演算子・関係記号・論理記号
[operators]
"⊂" = "ブブンシュウゴウ"
"⊆" = "ブブンシュウゴウ"
"¬" = "ノット"
"∧" = "カツ"
"∨" = "マタハ"
"⇔" = "ドウチ"
"⇒" = "ナラバ"
"∀" = "スベテノ"
"∃" = "ソンザイスル"
"→" = "ヘ"
":" = "タイ"
"+" = "プラス"
"-" = "マイナス"
"×" = "カケル"
"÷" = "ワル"
"=" = "イコール"
"≠" = "ノットイコール"
"≒" = "ニアリーイコール"
"≦" = "ショウナリイコール"
"≧" = "ダイナリイコール"
"<" = "ショウナリ"
">" = "ダイナリ"
"±" = "プラスマイナス"
"∈" = "ゾクスル"
"∉" = "ゾクサナイ"
"∪" = "カップ"
"∩" = "キャップ"
"⊥" = "スイチョク"
"∥" = "ヘイコウ"
"≡" = "ゴウドウ"
