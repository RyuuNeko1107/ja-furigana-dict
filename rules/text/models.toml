# 型番パターン (PC 部品・端末・規格)
#
# 「RTX 4070 Ti」 「Ryzen 7 5800X3D」 「i9-13900K」 のような ブランド + 数字 + 接尾辞 を 1 語として読む。
# 数字の読み方も英字の読み方も語ごとに違うので、 型番ごとに 「どの部分をどう読むか」 を書く。
# 書式は lib の `rules/models.rs` (docs/SCHEMA.md の [[model]] も参照)。
#
# - pattern: 先頭一致の正規表現 (大文字小文字は区別しない)。 読みたい部分を括弧で囲む。
#   前後が英数字の時 (語の途中) は当たらない。 数字は [0-9] と書く
# - reading: カタカナ + {N} / {N:style}。 style = place / each / each_en / english / pair / pair_en / dotted / part / spell
#   省略時は 数字だけ → each、 それ以外 → part
# - first: pattern の頭が英字でない時、 先頭になりうる英字 (検索の絞り込み用)
# - [parts]: 接尾辞の読み。 無い部分は英字 1 字ずつ (K = ケー、 X3D = エックススリーディー)
#
# 曖昧な型番 (A100 / G502 / M2 だけ 等) は入れない。 他の語に当たると読みが壊れる。

[meta]
schema_version = "2"
role = "models"
description = "型番パターン (RTX / Ryzen / Core i / iPhone / Galaxy / Pixel / PS5 / DDR / PCIe / USB / Wi-Fi 等、 ブランド + 数字 + 接尾辞を 1 語で読む)"

[parts]
"Ti" = "ティーアイ"
"Super" = "スーパー"
"Ti Super" = "ティースーパー"
"XT" = "エックスティー"
"XTX" = "エックスティーエックス"
"GRE" = "ジーアールイー"
"X3D" = "エックススリーディー"
"Pro" = "プロ"
"Pro Max" = "プロマックス"
"Max" = "マックス"
"Ultra" = "ウルトラ"
"Plus" = "プラス"
"Mini" = "ミニ"
"Air" = "エアー"
"Lite" = "ライト"
"Slim" = "スリム"
"FE" = "エフイー"
"XL" = "エックスエル"
"Pro XL" = "プロエックスエル"
"Fold" = "フォールド"
"Pro Fold" = "プロフォールド"
"Flip" = "フリップ"
"SE" = "エスイー"
"Elite" = "エリート"
"mini" = "ミニ"
"turbo" = "ターボ"
"o mini" = "オーミニ"
"Flash" = "フラッシュ"
"Opus" = "オーパス"
"Sonnet" = "ソネット"
"Haiku" = "ハイク"
"R" = "アール"
"T" = "ティー"
"Pro+" = "プロプラス"
"Pro Plus" = "プロプラス"
"LTS" = "エルティーエス"
"a" = "エー"
"e" = "イー"
"omini" = "オーミニ"

# ─── GPU ──────────────────────────────────────────────────────────────

[[model]]
pattern = 'RTX\s?([0-9]{4})(?:\s?(Ti Super|Ti|Super))?'
reading = "アールティーエックス{1:each}{2:part}"

[[model]]
pattern = 'RTX\s?A([0-9]{4})'
reading = "アールティーエックスエー{1:each}"

[[model]]
pattern = 'GTX\s?([0-9]{3,4})(?:\s?(Ti|Super))?'
reading = "ジーティーエックス{1:each}{2:part}"

[[model]]
pattern = 'GT\s?([0-9]{3,4})'
reading = "ジーティー{1:each}"

[[model]]
pattern = 'RX\s?([0-9]{3,4})(?:\s?(XTX|XT|GRE))?'
reading = "アールエックス{1:each}{2:part}"

[[model]]
pattern = 'Arc\s?([AB])([0-9]{3})'
reading = "アーク{1:spell}{2:each}"

# ─── CPU ──────────────────────────────────────────────────────────────

# Core i9-13900K / i7 12700KF / i5-1135G7
[[model]]
pattern = 'i([3579])[- ]?([0-9]{4,5})([A-Z]{0,2}[0-9]?)'
reading = "アイ{1:english}{2:each}{3:part}"

[[model]]
pattern = 'i([3579])'
reading = "アイ{1:english}"

# Core Ultra 7 155H
[[model]]
pattern = 'Ultra\s?([3579])\s?([0-9]{3})([A-Z]{0,2})'
reading = "ウルトラ{1:english}{2:each}{3:part}"

# Ryzen 7 5800X3D / Ryzen 5 7600
[[model]]
pattern = 'Ryzen\s?([3579])\s?([0-9]{4})([A-Z0-9]{0,3})'
reading = "ライゼン{1:english}{2:each}{3:part}"

[[model]]
pattern = 'Ryzen\s?([3579])'
reading = "ライゼン{1:english}"

[[model]]
pattern = 'Snapdragon\s?([0-9])\s?Gen\s?([0-9])'
reading = "スナップドラゴン{1:english}ジェン{2:english}"

[[model]]
pattern = 'Snapdragon\s?([0-9])\s?(Elite)'
reading = "スナップドラゴン{1:english}{2:part}"

[[model]]
pattern = 'Snapdragon\s?([0-9]{3,4})'
reading = "スナップドラゴン{1:place}"

[[model]]
pattern = 'Dimensity\s?([0-9]{4})'
reading = "ディメンシティ{1:place}"

[[model]]
pattern = 'Tensor\s?G([0-9])'
reading = "テンソルジー{1:english}"

# Intel N100 / N95 (ミニ PC) と N95 マスク
[[model]]
pattern = 'N(100|95|97|150|200|305|355)'
reading = "エヌ{1:place}"

# ─── Apple ────────────────────────────────────────────────────────────

[[model]]
pattern = 'Apple\s?M([1-9])(?:\s?(Pro|Max|Ultra))?'
reading = "アップルエム{1:english}{2:part}"

[[model]]
pattern = 'M([1-9])\s(Pro|Max|Ultra)'
reading = "エム{1:english}{2:part}"

[[model]]
pattern = 'iPhone\s?([0-9]{1,2})(?:\s?(Pro Max|Pro|Plus|Max|mini|e))?'
reading = "アイフォン{1:place}{2:part}"

[[model]]
pattern = 'iPad\s?(Pro|Air|mini)(?:\s?([0-9]{1,2}))?'
reading = "アイパッド{1:part}{2:place}"

# ─── スマホ ───────────────────────────────────────────────────────────

[[model]]
pattern = 'Galaxy\s?Z\s?(Flip|Fold)\s?([0-9]{1,2})'
reading = "ギャラクシーゼット{1:part}{2:english}"

[[model]]
pattern = 'Galaxy\s?([SAZ])\s?([0-9]{1,2})(?:\s?(Ultra|Plus|FE|\+))?'
reading = "ギャラクシー{1:spell}{2:place}{3:part}"

[[model]]
pattern = 'Pixel\s?([0-9]{1,2})(?:\s?(Pro XL|Pro Fold|Pro|XL|a|Fold))?'
reading = "ピクセル{1:english}{2:part}"

# ─── ゲーム機 ─────────────────────────────────────────────────────────

[[model]]
pattern = 'PS([2-5])(?:\s?(Pro|Slim))?'
reading = "ピーエス{1:english}{2:part}"

[[model]]
pattern = 'PSVR\s?([12])'
reading = "ピーエスブイアール{1:english}"

[[model]]
pattern = 'Xbox\s?Series\s?([XS])'
reading = "エックスボックスシリーズ{1:spell}"

[[model]]
pattern = 'Quest\s?([0-9])(S?)'
reading = "クエスト{1:english}{2:spell}"

# ─── マザーボードのチップセット ───────────────────────────────────────

[[model]]
pattern = '([ZBHXA])([2-9][0-9]0)([EMF]?)'
first = "ZBHXA"
reading = "{1:spell}{2:each}{3:spell}"

# ─── メモリ / 規格 ────────────────────────────────────────────────────

[[model]]
pattern = 'DDR([3-6])(?:-([0-9]{3,5}))?'
reading = "ディーディーアール{1:english}{2:place}"

[[model]]
pattern = 'LPDDR([3-6])(X?)'
reading = "エルピーディーディーアール{1:english}{2:spell}"

[[model]]
pattern = 'PCI-?e(?:xpress)?\s?(?:Gen\s?)?([0-9](?:\.[0-9])?)'
reading = "ピーシーアイイー{1:dotted}"

[[model]]
pattern = 'USB\s?([0-9]\.[0-9])\s?Gen\s?([0-9])x([0-9])'
reading = "ユーエスビー{1:dotted}ジェン{2:english}バイ{3:english}"

[[model]]
pattern = 'USB\s?([0-9]\.[0-9])'
reading = "ユーエスビー{1:dotted}"

[[model]]
pattern = 'USB\s?([0-9])'
reading = "ユーエスビー{1:english}"

[[model]]
pattern = 'USB-?C'
reading = "ユーエスビーシー"

[[model]]
pattern = 'Type-?C'
reading = "タイプシー"

[[model]]
pattern = 'Wi-?Fi\s?([0-9])(E?)'
reading = "ワイファイ{1:english}{2:spell}"

[[model]]
pattern = 'HDMI\s?([0-9]\.[0-9])'
reading = "エイチディーエムアイ{1:dotted}"

[[model]]
pattern = 'DisplayPort\s?([0-9]\.[0-9])'
reading = "ディスプレイポート{1:dotted}"

[[model]]
pattern = 'Bluetooth\s?([0-9](?:\.[0-9])?)'
reading = "ブルートゥース{1:dotted}"

[[model]]
pattern = 'M\.2'
reading = "エムドットツー"

# ─── その他 ───────────────────────────────────────────────────────────

[[model]]
pattern = 'GPT-?([0-9])(o\s?mini|o|\s?mini)?'
reading = "ジーピーティー{1:english}{2:part}"

[[model]]
pattern = 'W([HF])-?1000XM([0-9])'
reading = "ダブリュー{1:spell}センエックスエム{2:english}"

[[model]]
pattern = 'MX\s?Master\s?([0-9])(S?)'
reading = "エムエックスマスター{1:english}{2:spell}"

# ─── CPU / GPU の追加分 ───────────────────────────────────────────────

[[model]]
pattern = 'Threadripper\s?(?:PRO\s?)?([0-9]{4})([A-Z]{0,2})'
reading = "スレッドリッパー{1:each}{2:part}"

[[model]]
pattern = 'EPYC\s?([0-9]{4})([A-Z]?)'
reading = "エピック{1:each}{2:part}"

[[model]]
pattern = 'Athlon\s?([0-9]{3,4})([A-Z]{0,2})'
reading = "アスロン{1:each}{2:part}"

[[model]]
pattern = 'Radeon\s?([0-9]{3,4})([A-Z]{0,2})'
reading = "ラデオン{1:each}{2:part}"

[[model]]
pattern = 'Xeon\s?(?:W|E|Gold|Silver|Platinum)?-?\s?([0-9]{4})([A-Z]{0,2})'
reading = "ジーオン{1:each}{2:part}"

# DDR5-6000 CL30 の CL
[[model]]
pattern = 'CL\s?([0-9]{2})'
reading = "シーエル{1:place}"

# ─── ストレージ / 周辺機器 ────────────────────────────────────────────

[[model]]
pattern = 'SN([0-9]{3,4})(X?)'
reading = "エスエヌ{1:each}{2:spell}"

[[model]]
pattern = 'DeathAdder\s?V([0-9])'
reading = "デスアダーブイ{1:english}"

[[model]]
pattern = 'BlackWidow\s?V([0-9])'
reading = "ブラックウィドウブイ{1:english}"

[[model]]
pattern = 'Viper\s?V([0-9])(?:\s?(Pro))?'
reading = "バイパーブイ{1:english}{2:part}"

[[model]]
pattern = 'Superlight\s?([0-9])'
reading = "スーパーライト{1:english}"

# ─── Apple の追加分 ───────────────────────────────────────────────────

[[model]]
pattern = 'MacBook\s?(Air|Pro)\s?M([1-9])(?:\s?(Pro|Max|Ultra))?'
reading = "マックブック{1:part}エム{2:english}{3:part}"

[[model]]
pattern = 'Mac\s?(mini|Studio|Pro)\s?M([1-9])(?:\s?(Pro|Max|Ultra))?'
reading = "マック{1:part}エム{2:english}{3:part}"

[[model]]
pattern = 'iMac\s?M([1-9])'
reading = "アイマックエム{1:english}"

[[model]]
pattern = 'AirPods\s?(Pro|Max)(?:\s?([0-9]))?'
reading = "エアポッズ{1:part}{2:english}"

[[model]]
pattern = 'AirPods\s?([0-9])'
reading = "エアポッズ{1:english}"

[[model]]
pattern = 'Apple\s?Watch\s?Series\s?([0-9]{1,2})'
reading = "アップルウォッチシリーズ{1:english}"

[[model]]
pattern = 'Apple\s?Watch\s?Ultra\s?([0-9])?'
reading = "アップルウォッチウルトラ{1:english}"

# ─── スマホ / ゲーム機の追加分 ────────────────────────────────────────

[[model]]
pattern = 'Xperia\s?([0-9]{1,2})'
reading = "エクスペリア{1:english}"

[[model]]
pattern = 'sense\s?([0-9]{1,2})'
reading = "センス{1:english}"

[[model]]
pattern = 'OnePlus\s?([0-9]{1,2})(?:\s?(Pro|R))?'
reading = "ワンプラス{1:place}{2:part}"

[[model]]
pattern = 'Redmi\s?Note\s?([0-9]{1,2})(?:\s?(Pro\+|Pro Plus|Pro))?'
reading = "レッドミーノート{1:place}{2:part}"

[[model]]
pattern = 'Xiaomi\s?([0-9]{1,2})(?:\s?(Ultra|Pro|T))?'
reading = "シャオミ{1:place}{2:part}"

[[model]]
pattern = 'Xbox\s?One\s?([XS])'
reading = "エックスボックスワン{1:spell}"

[[model]]
pattern = 'ROG\s?Ally\s?(X?)'
reading = "ロッグアライ{1:spell}"

# ─── ソフトウェア / AI のバージョン ───────────────────────────────────

[[model]]
pattern = 'Ubuntu\s?([0-9]{2})\.([0-9]{2})(?:\s?(LTS))?'
reading = "ウブントゥ{1:place}テン{2:each}{3:spell}"

[[model]]
pattern = 'Python\s?([0-9])\.([0-9]{1,2})'
reading = "パイソン{1:english}テン{2:place}"

[[model]]
pattern = 'GPT-?([0-9])\.([0-9])(o\s?mini|o|\s?mini)?'
reading = "ジーピーティー{1:english}テン{2:english}{3:part}"

[[model]]
pattern = 'Llama\s?([0-9])\.([0-9])'
reading = "ラマ{1:english}テン{2:english}"

[[model]]
pattern = 'Llama\s?([0-9])'
reading = "ラマ{1:english}"

[[model]]
pattern = 'Claude\s?([0-9])\.([0-9])\s?(Opus|Sonnet|Haiku)'
reading = "クロード{1:english}テン{2:english}{3:part}"

[[model]]
pattern = 'Claude\s?([0-9])\s?(Opus|Sonnet|Haiku)'
reading = "クロード{1:english}{2:part}"

[[model]]
pattern = 'Gemini\s?([0-9])\.([0-9])\s?(Pro|Flash|Ultra)'
reading = "ジェミニ{1:english}テン{2:english}{3:part}"

[[model]]
pattern = 'Gemini\s?([0-9])\s?(Pro|Flash|Ultra)'
reading = "ジェミニ{1:english}{2:part}"

[[model]]
pattern = 'Node(?:\.js)?\s?([0-9]{1,2})'
reading = "ノード{1:place}"

[[model]]
pattern = 'ROCm\s?([0-9])\.([0-9])'
reading = "ロックエム{1:english}テン{2:english}"

[[model]]
pattern = 'CUDA\s?([0-9]{1,2})\.([0-9])'
reading = "クーダ{1:place}テン{2:english}"

[[model]]
pattern = 'CUDA\s?([0-9]{1,2})'
reading = "クーダ{1:place}"
