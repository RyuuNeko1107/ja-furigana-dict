# 文脈の手がかり語 (role = "context_cues")
#
# 数字や記号の読みが文脈で変わるもの (いまは N/M が日付か分数か) を、 手がかりの語で決める。
# lib に組み込んだ手がかり (曜日の括弧 / 時刻 / くらい / HP …) に **足される**。
#
# 判定の順番 (lib):
#   1. 分数の手がかり (fraction_after / fraction_before) があれば分数
#   2. 日付の手がかり (date_after / date_before / 曜日 / 時刻 / 範囲) があれば日付
#   3. どちらも無ければ、 文全体の話題で決める:
#      fraction_topic の語があれば決めない / date_topic の語があり、 N/M が文頭・空白・括弧の直後に
#      書かれていれば日付。 ただし 1/2〜1/10 と 3/3 のように分数と紛れる組は決めない
#
# 語を足す時の注意:
#   - 日付の語は 「その語がある文の N/M はまず日付」 という強さで入れる。 一般語 (ポイント / 時間) は入れない
#   - 日付側と分数側の両方に同じ語を置かない (validate が弾く)
#   - 実コメントで確かめてから足す (誤爆すると分数が日付になる)

[meta]
schema_version = "2"
role = "context_cues"
description = "N/M が日付か分数かを決める手がかり語"

[slash_pair]
# N/M の直後にあれば日付 (10/5まで・10/5開催)
date_after = [
  "予約開始", "配信開始", "発売開始", "販売開始", "受付開始", "募集開始", "応募開始", "開催", "締切", "締め切り",
  "発売決定", "公開", "実装", "開始", "終了", "放送", "更新", "休み", "休業", "定休", "営業", "出勤", "入荷", "納品",
  "発送", "提出", "開場", "開演", "初日", "千秋楽", "予定", "以降", "以前", "現在", "当日", "生誕", "誕生",
  "メンテ", "アップデート", "配信予定", "発売予定", "公開予定", "リリース", "追加", "復刻", "ガチャ", "イベント",
]

# N/M の直前にあれば日付 (本日10/5・締切10/5)
date_before = [
  "本日", "明日", "明後日", "来月", "今月", "再来月", "締切", "締め切り", "〆切", "期限", "期日", "納期", "発売日", "開催日",
  "配信日", "更新日", "公開日", "開始日", "予定日", "放送日", "初日", "最終日", "日程", "日時", "日付", "期間", "開場",
  "開演", "開店", "閉店", "休業日", "定休日", "誕生日", "記念日", "配信予定", "発売予定", "公開予定", "開催期間", "販売期間",
]

# 文のどこかにあれば日付の話題 (N/M は文頭・空白・括弧の直後の時だけ日付にする)
date_topic = [
  "予約開始", "配信開始", "発売開始", "販売開始", "受付開始", "募集開始", "発売決定", "発表", "期間限定", "セール",
  "還元", "最安値", "延期", "周年", "出勤", "出勤情報", "案内状況", "フェア", "新刊", "新作", "新商品", "入荷", "再入荷",
  "再販", "開演", "開場", "開園", "休館", "臨時休業", "抽選", "当選発表", "申込", "申し込み", "締め切り", "納期", "納品",
  "発送", "出荷", "実装", "ピックアップ", "復刻", "開幕", "先発", "登板", "出場", "ゲスト", "生放送", "最終回", "初回",
  "ストア", "Kindle", "コミックス", "分冊版", "文庫", "電子書籍", "予約受付", "プロモーション",
]

# N/M の直後にあれば分数 (1/3くらい・2/3以上)
fraction_after = [
  "倍", "割", "以上", "以下", "未満", "程度", "強", "弱", "全体", "ほど", "くらい", "ぐらい", "ずつ",
]

# N/M の直前にあれば分数 (HP 3/5・確率1/3)
fraction_before = [
  "HP", "MP", "SP", "LP", "確率", "割合", "体力", "ゲージ", "ライフ", "耐久", "耐久値", "残量", "満腹度", "進捗",
  "達成率", "勝率", "成功率", "縮尺", "比率", "スケール", "バッテリー", "容量",
]

# 文のどこかにあれば分数の話題 (あれば文脈だけでは日付にしない)
fraction_topic = [
  "程度", "半分", "確率", "進捗", "全体", "サイズ", "割合", "倍率", "達成率", "勝率", "打率", "成功率", "出現率",
  "ドロップ率", "体力", "満タン", "重量", "縮尺", "比率", "分母", "分子", "分数", "通分", "約分", "占め", "未満",
  "スコア", "ダメージ", "ページ", "勝敗", "ターン", "クリア", "完了", "リスト", "ヒット",
  "方程式", "不等式", "連立", "代入", "因数分解", "係数", "数式", "の式", "二次関数", "一次関数", "解の公式", "約数", "整数",
]

# 伏せ字の図形記号 (■ ▲ ● ◆ ◇ ▼ は装飾にも使われる) の直後に付く敬称・肩書き。
# ちょうど 2 つ並び (■■) なら後ろの語に関係なく伏せ字として読むが、 1 つだけ (■さん) は
# ここにある語が直後に付く時だけ読む。 lib に組み込んだ さん / くん / 君 / ちゃん / 様 / 氏 / 先生 / 殿 に足される
[placeholder]
honorifics = [
  "さま", "どの", "ちゃま", "たん", "ぴ", "師匠", "先輩", "後輩", "部長", "課長", "係長", "社長", "店長", "院長", "校長", "監督",
  "選手", "議員", "大臣", "総理", "長官", "知事", "市長", "町長", "会長", "代表", "教授", "博士", "先生", "氏", "殿",
  "兄", "姉", "兄さん", "姉さん", "おじさん", "おばさん", "叔父", "叔母", "お兄", "お姉", "パパ", "ママ", "ちゃん", "くん", "君",
]
