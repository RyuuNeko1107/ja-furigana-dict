# SI / 一般単位
#
# ## 用途
#
# 「km / kg / mL / 円 / %」 のような **数値 + 単位** を 1 chunk で読む table。
# 数値読み + 単位読みで合成 (例: 「100km → ヒャクキロメートル」)。
#
# 例:
#   「100km」  → ヒャクキロメートル
#   「3L」     → サンリットル
#   「2.5kg」  → ニテンゴキログラム
#   「1万円」  → イチマンエン (= scales.toml の 「万」 と末尾 unit 「円」 が合成)
#
# ## どのとき発火するか
#
# lib の chunks/split() で `NUM_PAT + (unit symbol)` regex が match した時、
# 1 chunk として si_unit_reading() に流される。 scales.toml の scale 末尾の
# 漢字 unit (= 「円」 「個」 等) もここの table を参照して unit kana を解決。
#
# ## 追加するなら
#
# - inline-table 形式: `"記号" = { kana = "読み" }` または `{ kana = "...", ci = false }`
# - **case-insensitive lookup が default**: `"km"` と書けば `"KM"` `"Km"` `"kM"`
#   全部 hit (= TTS 用途では実用的)
# - **case-sensitive にしたい場合のみ** `ci = false`: 例えば 「mg」 (ミリグラム)
#   と 「Mg」 (メガグラム) を区別したい SI 厳密モードでは:
#     "mg" = { kana = "ミリグラム", ci = false }
#     "Mg" = { kana = "メガグラム", ci = false }
# - 通貨 (= 「円」 「\$」 「€」) もここに置く (= 数値 + 通貨記号の合成)
#
# ## 注意点
#
# - **記号 1 文字** (= 「%」 「‰」 「°」) は symbols.toml に置く (= 数値抜きで単独でも
#   読みが要るため)、 ただし数値 + 記号で 1 chunk 化したい場合は本 file にも登録
# - 「リットル」 と 「mL」 のような 「prefix + 基底単位」 の組み合わせは
#   各 prefix 込みで個別に登録 (= "kL" / "mL" / "μL" / "L" 全部 entry)、 prefix
#   table の動的合成は無し


[meta]
schema_version = "2"
role = "units"
description = "SI 単位 + 通貨 + % (km / kg / mL / 円 / % 等、 数値 + 単位を 1 chunk で読む。 lookup は case-insensitive)"

[entries]
"℃"  = { kana = "ド" }          # ★2026-09-11: NFKC で ℃ → °C に分解され、 「5℃」 が
"°C" = { kana = "ド" }          # 「ごどC」 (C が残る) になっていた
"℉"  = { kana = "カド" }
"°F" = { kana = "カド" }
"km" = { kana = "キロメートル" }
"cm" = { kana = "センチメートル" }
"mm" = { kana = "ミリメートル" }
"m"  = { kana = "メートル", ci = false }   # ★2026-09-11: 「3M」 が サンメートル 化けするので小文字限定
"kg" = { kana = "キログラム" }
"mg" = { kana = "ミリグラム" }
"g"  = { kana = "グラム", ci = false }     # ★2026-09-11: 「4G」 (通信規格) が ヨングラム 化けするので小文字限定
"t"  = { kana = "トン", ci = false }       # ★2026-09-11: 「5T」 が ゴトン 化けするので小文字限定
"mL" = { kana = "ミリリットル", ci = true }
"L"  = { kana = "リットル", ci = true }
"TB" = { kana = "テラバイト" }
"GB" = { kana = "ギガバイト" }
"MB" = { kana = "メガバイト" }
"KB" = { kana = "キロバイト" }
# ★2026-09-21: 周波数 (87.5MHz / 5GHz が 数字ごと未読で残っていた)。 大小文字は区別 (mhz は使わない)
"Hz"  = { kana = "ヘルツ", ci = false }
"kHz" = { kana = "キロヘルツ", ci = false }
"MHz" = { kana = "メガヘルツ", ci = false }
"GHz" = { kana = "ギガヘルツ", ci = false }

# 通貨 / 数量単位 (NumberChunker で N + 円 を 1 chunk にする用)
"円" = { kana = "エン" }
"%"  = { kana = "パーセント" }
"％" = { kana = "パーセント" }

# ★2026-10-11: 配信 / ゲーム / 通信で素通しだった単位 (100pt / 30fps / 24h配信 / 100px)。
# h と ms は小文字限定 (H は 水素 / 型番、 MS は Microsoft 等と紛れる)
"pt"   = { kana = "ポイント" }
"fps"  = { kana = "エフピーエス" }
"px"   = { kana = "ピクセル" }
"h"    = { kana = "ジカン", ci = false }
"ms"   = { kana = "ミリビョウ", ci = false }
"dB"   = { kana = "デシベル", ci = false }
"kbps" = { kana = "キロビーピーエス" }
"Mbps" = { kana = "メガビーピーエス", ci = false }
"Gbps" = { kana = "ギガビーピーエス", ci = false }
"kcal" = { kana = "キロカロリー" }
"mAh"  = { kana = "ミリアンペアアワー", ci = false }
# 単位/単位 (毎時・毎秒)。 数字つき (60km/h) も単独の km/h も読む。 URL / パスの中は lib が読まない
"km/h" = { kana = "キロメートルマイジ" }
"m/s"  = { kana = "メートルマイビョウ", ci = false }
"km/s" = { kana = "キロメートルマイビョウ" }
"mph"  = { kana = "マイルマイジ" }
"rpm"  = { kana = "アールピーエム", ci = false }
"bps"  = { kana = "ビーピーエス", ci = false }

"bit"  = { kana = "ビット", ci = false }
"Kbps" = { kana = "キロビーピーエス", ci = false }
