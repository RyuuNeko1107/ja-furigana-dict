# 出力後処理 regex ルール (Step 7 (mode 別後処理 regex))
#
# Furigana::to_hiragana / to_ruby / to_tts / to_romaji の出力直前に適用。
# 辞書 / context rule で表現しづらい文字列レベルの最終調整に使う。
#
# ## 形式
#
# ```toml
# [[rule]]
# pattern = "ジュウパー"             # regex
# replacement = "ジュッパー"          # 置換文字列 ($1, $2 で capture group 参照可)
# modes = ["hiragana", "tts"]      # 適用 mode (空 or 省略 = 全 mode)
# ```
#
# ## 注意
#
# - regex は Rust の `regex` crate (POSIX 風、`(?P<name>...)` も可)
# - replacement で `$0` は全マッチ、`$1` は 1 番目の capture
# - ruby mode (`{漢字|読み}` 構造) で適用するときは `|` `{` `}` が壊れない pattern にする

# ─── 数値 + 単位の促音化補正 ─────────────────────────────────────────────
# 「ゴジュウパーセント」→「ゴジュッパーセント」のような促音化補正。
# euphonic_counter_read の助数詞ルートでは sokuonize_last が動くが、
# si_unit (「%」) ルートでは promotion なしなので最後にここで補う。


[meta]
schema_version = "2"
role = "postprocess"
description = "出力後処理 regex (Step 7、 mode 別: hiragana / ruby / tts / romaji の出力直前に適用)"

[[rule]]
pattern = "ジュウパー"
replacement = "ジュッパー"
modes = []

[[rule]]
pattern = "じゅうぱー"
replacement = "じゅっぱー"
modes = []

# Ver.1.2 の Ver の後ろのドットが読みに残る (バージョン.いちてんに) のを消す
[[rule]]
pattern = '(バージョン|ばーじょん)\.([ぁ-んァ-ヶー0-9])'
replacement = "$1$2"
modes = []

# ′ ″ (プライム / ダブルプライム。 NFKC で ″ は ′′ になる) の読み。 数や英字の直後だけ読む (′′届く′′ のような引用符がわりの ′ は触らない)。
# 1. 度分秒 (北緯35°41′22″ / 東経139°46′): 「数 + 度」 の直後に数が続いて ′ が付く形だけ 分 / 秒 と読む
[[rule]]
pattern = '((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)ど((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)′((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)′′'
replacement = "${1}ど${2}ふん${3}びょう"
modes = []

[[rule]]
pattern = '((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)ど((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)′'
replacement = "${1}ど${2}ふん"
modes = []

# 度分秒の 分 の促音 (41′ = よんじゅういっぷん / 46′ = よんじゅうろっぷん / 38′ = さんじゅうはっぷん / 30′ = さんじゅっぷん / 100 = ひゃっぷん)
# 上の規則が付けた 「ふん」 だけが対象 (「どN」 + ふん)
[[rule]]
pattern = 'ど([ぁ-んー]*)いちふん'
replacement = "ど${1}いっぷん"
modes = []

[[rule]]
pattern = 'ど([ぁ-んー]*)ろくふん'
replacement = "ど${1}ろっぷん"
modes = []

[[rule]]
pattern = 'ど([ぁ-んー]*)はちふん'
replacement = "ど${1}はっぷん"
modes = []

[[rule]]
pattern = 'ど([ぁ-んー]*)じゅうふん'
replacement = "ど${1}じゅっぷん"
modes = []

[[rule]]
pattern = 'ど([ぁ-んー]*)ひゃくふん'
replacement = "ど${1}ひゃっぷん"
modes = []

# 2. 身長 5′10″ (3〜8 フィート + インチ)。 度分秒の規則の後に置く
[[rule]]
pattern = '(さん|よん|ご|ろく|なな|しち|はち)′((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)′′'
replacement = "${1}フィート${2}インチ"
modes = []

# 3. 化学名・遺伝子・微分 (3,3′-ジクロロ / 5′末端 / 3′UTR / x′ / f′(x))。
#   独立した 1 字の英字 (x′ / f′(x)) の直後の ′ は ダッシュ。 英単語のアポストロフィ (B′z / kissin′) は触らない。 数の直後は 直後が 末 (読みは まっ) ・側 (がわ)・- ・英字・次の「数′」 の時だけ (′′届く′′ のような引用符がわりの ′ は触らない)
[[rule]]
pattern = '(^|[^A-Za-z])([A-Za-z])′([^A-Za-z]|$)'
replacement = "${1}${2}だっしゅ${3}"
modes = []

[[rule]]
pattern = '((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)′((?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+′|まっ|がわ|-|[A-Za-z])'
replacement = "${1}だっしゅ${2}"
modes = []

# 連なった 3′3′- の 2 つ目 (1 つ目を直した後の「数′-」)
[[rule]]
pattern = '(だっしゅ(?:ぜろ|れい|いち|に|さん|よん|し|ご|ろく|なな|しち|はち|きゅう|く|じゅう|じゅっ|ひゃく|ひゃっ|せん|まん|てん)+)′(-|[A-Za-z])'
replacement = "${1}だっしゅ${2}"
modes = []
