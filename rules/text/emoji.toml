# 絵文字の読み
#
# ## 形式
# 絵文字 1 つ (肌色・ZWJ・国旗を含む 1 まとまり) → 読み。 キーは VS16 (U+FE0F) と肌色 (U+1F3FB..1F3FF) を
# 除いた形で書けば、 付いている形も同じに引く (⏰ も ⏰️ も同じ)。
#
# ## 読みの意味
# - `""` (空)       : 常に読まない (装飾)
# - `"めざましどけい|目覚まし|時計"` : 名詞として読む (`|` の後ろは別表記)。 **直後が格助詞 (を が は の に で と も へ や) の時だけ**。
#                       `🥚を産む` = たまごをうむ。 `アイス🍨楽しみー` のように装飾で付いた時は読まない
#                       (読むと 「アイスアイス」 になる)
# - 直前の語が読み・別表記で終わる時 (`ラーメン🍜が` / `お風呂🛁に`) は、 その語の装飾なので読まない
# - `"!ありがとう"`   : 先頭 `!` は直前・直後を問わず常に読む
# - 載っていない絵文字は従来どおり表記のまま通す (TTS 側に任せる)
#
# ## 足すとき
# 1 つの絵文字が名詞として使われるもの (食べ物・動物・物・場所) は名詞の読みを書く。
# 顔や手の絵文字のように意味が文脈で変わるものは、 決めきれないので書かない。

[meta]
schema_version = "2"
role = "emoji"
description = "絵文字の読み (名詞は直後が格助詞の時だけ読む)"

