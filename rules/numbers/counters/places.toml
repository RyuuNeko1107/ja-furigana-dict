# 場所を数える助数詞 (階 / ヶ所 / 箇所 / か所)

[meta]
schema_version = "2"
role = "counters"
description = "場所を数える助数詞 (階 / ヶ所 / 箇所 / か所、 連濁 / 促音化)"

# === begin: 階 ===
[counter."階"]
default = "カイ"
kanji_numeral = true  # 六階/八階/十階 → ろっかい/はっかい/じゅっかい (漢数字 bare 対応)

[[counter."階".rules]]
last_digit = [1, 6, 8, 0]
suffix = "カイ"
sokuonize = true

[[counter."階".rules]]
last_digit = [3]
suffix = "ガイ"
# === end: 階 ===

# === begin: ヶ所 ===
[counter."ヶ所"]
default = "カショ"
