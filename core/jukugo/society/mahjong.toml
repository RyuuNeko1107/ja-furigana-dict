# 麻雀用語 (役・牌・場・用語)
#
# 出典: 読み上げ BOT の誤読報告 (2026-09-11)。麻雀役は中国語由来の慣用読みで、
# 素の音訓合成では全く当たらない (四暗刻 → よんあんこく 等)。
#
# 方針:
# - 一般語と衝突する語は無条件登録しない (平和=ヘイワ / 親・子・中・発 単漢字 /
#   国士無双=コクシムソウ は一般語読みが正しいので据え置き)
# - 清一色 / 東風 だけは **文スコープ condition** (`input_contains_any`、 ADR-0010) で分岐。
#   同じ文に麻雀語がある時だけ麻雀読みにし、 それ以外は一般語読みのまま
# - 雀魂 (麻雀ゲーム) の段位部屋名も麻雀文脈語として収録
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

[meta]
schema_version = "2"
role = "jukugo"

[entries]

# --- 基本語 ---
"麻雀部" = "マージャンブ"      # default 「あさささべ」 (麻/雀/部 分割) の救済
"麻雀部員" = "マージャンブイン"
"雀卓" = "[ジャンタク" # default すずめたく
"雀頭" = "ジャントウ"          # default すずめとう
"半荘" = "ハンチャン"
"東風戦" = "トンプウセン"      # 東風 単独は一般語 「こち」 据え置き
"東風局" = "トンプウキョク"
"東場" = "トンバ"
"南場" = "[ナ]ンバ"
"親番" = "[オヤバン"
"配牌" = "[ハイパイ"
"王牌" = "ワンパイ"
"索子" = "ソーズ"
"筒子" = "[ピンズ"
# 「萬子」 は compat 正規化で 「万子」 になり、 人名 (カズコ 等) と衝突するため非登録
"么九牌" = "ヤオチューハイ"
"中張牌" = "チュンチャンパイ"
"東南西北" = "トンナンシャーペー"

# --- 手牌構成 ---
"順子" = "シュンツ"            # default じゅんこ
"刻子" = "コーツ"              # default こくし
"槓子" = "カンツ"              # default こうし
"面子" = "[メンツ"
"副露" = "フーロ"              # default ふくろ
"門前清" = "メンゼンチン"      # default もんぜんせい
"立直" = "リーチ"              # default たちなお
"聴牌" = "テンパイ"
"自摸" = "[ツ]モ" # default じさぐる
"栄和" = "ロンホー"            # default えいわ
"放銃" = "[ホウジュウ"
"責任払い" = "セキニンバライ"  # 払い=ばらい 連濁 (default はらい)

# --- 役 ---
"断么九" = "タンヤオチュウ"
"七対子" = "チートイツ"        # default しったいし
"対々和" = "トイトイホー"      # default たいだいわ
"一盃口" = "イーペーコー"      # default いちさかずきこう
"二盃口" = "リャンペーコー"
"三暗刻" = "サンアンコー"
"四暗刻" = "スーアンコー"      # default よんあんこく
"四槓子" = "スーカンツ"
"混一色" = "ホンイーソー"      # default こんいつしょく
"字一色" = "ツーイーソー"      # default じいっしょく
"緑一色" = "リューイーソー"    # default みどりいっしょく
"九蓮宝灯" = "チューレンポウトウ"  # compat 正規化後の表層 (入力 「九蓮宝燈」 もここに落ちる)
"小四喜" = "ショウスーシー"
# --- 2026-09-13 BOT 誤読報告 #10 (小三元) 起点で役名を再点検 ---
"小三元" = "ショウサンゲン"    # 報告 #10。 default こさんげん だった
"純全帯么九" = "ジュンチャンタイヤオチュウ"
"混全帯么九" = "ホンチャンタイヤオチュウ"
"混老頭" = "ホンロウトウ"
"清老頭" = "チンロウトウ"
"槍槓" = "チャンカン"          # default やりこう
"三色同刻" = "サンショクドウコー"
"大四喜" = "ダイスーシー"
# "天和" は元号 (テンナ、 history.toml) と衝突するため非登録
"地和" = "チーホー"            # default ちわ
"人和" = "レンホー"            # default ひとわ
"嶺上開花" = "リンシャンカイホウ"  # default みねうえかいか
"海底摸月" = "ハイテイモーユエ"    # default かいていさぐるげつ
"河底撈魚" = "ホウテイラオユイ"    # default かそころうぎょ
"搶槓" = "チャンカン"          # default つくこう

# --- 雀魂 段位部屋 ---
"銅の間" = "ドウノマ"          # default どうのあいだ
"銀の間" = "ギンノマ"
"金の間" = "キンノマ"
"玉の間" = "ギョクノマ"
"王座の間" = "オウザノマ"

# --- 文スコープ分岐 (ADR-0010) ---------------------------------------------
# 一般語としても成立する surface。 同一文に麻雀の話題語がある時だけ麻雀読みへ。
# 話題語 list は 「麻雀以外の文脈でまず出ない」 語に限る (= 「中」 「親」 等は入れない)。

[entries."清一色"]
reading = "セイイッショク"   # 一般語 (= 「清一色の男性」)

[[entries."清一色".match]]
input_contains_any = [
  "麻雀", "雀魂", "リーチ", "立直", "ツモ", "自摸", "ロン", "和了", "副露", "鳴い",
  "テンパイ", "聴牌", "フリテン", "振聴", "半荘", "東風", "南場",
  "ドラ", "役満", "混一色", "対々和", "七対子", "四暗刻", "国士無双", "牌", "打点",
]
reading = "チンイーソー"

# 「東風」 の文スコープ分岐は general.toml 側 (既存 entry 「[コ]チ」 を detailed 化) に置く

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."振聴"]  # default しんちょう
reading = "[フリテン"

[[entries."振聴".match]]
next_starts_any = ["か"]
reading = "[フリテン"

[entries."跳満"]  # default ちょうまん
reading = "ハネマン"

[[entries."跳満".match]]
next_starts_any = ["と"]
reading = "ハネマン"

