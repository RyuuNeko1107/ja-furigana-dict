# 競馬用語 (馬・馬券・脚質・厩舎)
#
# 出典: 2026-09-11 専門用語一括 probe (50 語) で誤読したもの。
# 馬券名 (単勝/複勝/枠連/馬単) や G1 名は素で正読するので非登録。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

[meta]
schema_version = "2"
role = "jukugo"

[entries]

"種牡馬" = "シュボバ"        # default たねぼば
"馬連" = "ウマレン"          # default ばれん (馬単=うまたん は素で正読)
"追い込み馬" = "オイコミウマ"
"脚質" = "[キャクシツ" # default あししつ
"鞍上" = "[アンジョウ" # default くらうえ
"外厩" = "ガイキュウ"        # default そとうまや
"繋駕速歩" = "ケイガソクホ"  # default けいがはやあし

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."追込"]  # default ついこ
reading = "オイコミ"

[[entries."追込".match]]
next_starts_any = ["も"]
reading = "オイコミ"

[entries."輓曳"]  # ばんえい競馬 (default ひくえい)
reading = "[バンエイ"

[[entries."輓曳".match]]
next_starts_any = ["か"]
reading = "[バンエイ"

