# 伝統遊戯 / games の難読読み
#
# general.toml への一括投入 (2026-06-21 agent×probe) から分類整理で分離した seed。
# 将棋固有は shogi.toml、 近代スポーツは sports.toml。 ここは囲碁 / かるた / 双六 /
# 郷土玩具 / 縁日遊び 等、 前近代の遊戯全般。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

