# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."宝引"]  
reading = "[ホウビキ"

[[entries."宝引".match]]
next_starts_any = ["か"]
reading = "[ホウビキ"

[entries."高目"]  
reading = "タカモク"

[[entries."高目".match]]
next_starts_any = ["と"]
reading = "タカモク"

[entries."手本引"]  
reading = "テホンビキ"

[[entries."手本引".match]]
next_starts_any = ["か"]
reading = "テホンビキ"

