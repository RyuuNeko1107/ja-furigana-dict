# スポーツ用語の難読読み (近代スポーツ / 競技 / 用語)
#
# 既存 arts.toml に武道 (柔道 / 剣道 / 弓道 / 空手 / 相撲 / 蹴鞠 / 合気道 /
# 居合道 / 杖道 / 古武術 / 鍛錬 / 稽古 / 門弟 / 師範) がある。
# ここは近代スポーツ / 競技 / 大会 / 練習用語。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)
# - 50 音順 を推奨

[meta]
schema_version = "2"
role = "jukugo"
description = "近代スポーツ / 球技 / 陸上 / 水泳 / 体操 / 大会"

[entries]

# ★2026-09-11 VV 比較 (閾値を下げた再走査)
"球種" = "[キュウシュ" # default たましゅ
"一球種" = "イッキュウシュ"    # 球種 entry が counter 経路に勝つので促音形を明示
"広角打法" = "コウカクダホウ"  # 打法=だほう (default こうかくうちほう)
"流し打ち" = "ナガシウチ"

# ★2026-09-11 VV 比較 第3R (野球ゲーム用語)
"対左" = "タイヒダリ"        # 対右=タイミギ と対 (default たいさ)
"対左投手" = "タイヒダリトウシュ"
"対右投手" = "タイミギトウシュ"

# ★2026-09-11 内部評価コーパス 内部評価コーパス token scan (野球実況)
"正捕手" = "セイホシュ"      # default せいとりて
"満塁男" = "マンルイオトコ"  # default まんるいだん

# ★2026-09-11 武道 probe (49 語)。 弓道の射法八節は送り仮名なし表記が多く訓が落ちる。
# 「蹲踞」 は剣道 ソンキョ だが茶道 ツクバイ と衝突するため非登録 (茶道側が既存)。
"胴造" = "ドウヅクリ"        # 同上 (default どうぞう)
"弓構" = "ユガマエ"          # 同上 (default ゆみこう)
"舟券" = "[フナケン" # 競艇 (default ふねけん)

# ★2026-09-11 野球 probe (50 語、 他は素で正読)
"隠し球" = "[カクシダマ" # 球=だま 連濁 (default かくしたま)

# ─── ア行 ─────────────────────────────────────────────

# ─── カ行 ─────────────────────────────────────────────

# ─── サ行 ─────────────────────────────────────────────

# ─── タ行 ─────────────────────────────────────────────

# ─── ナ行 ─────────────────────────────────────────────

# ─── ハ行 ─────────────────────────────────────────────

# ─── ヤ行 ─────────────────────────────────────────────

# ─── ラ行 ─────────────────────────────────────────────


# ─── ア行 ─────────────────────────────────────────────
"円盤投" = "エンバンナゲ"

# ─── カ行 ─────────────────────────────────────────────
"後攻" = "[コウコウ"

# ─── サ行 ─────────────────────────────────────────────
"砲丸投" = "ホウガンナゲ"
"槍投" = "ヤリナゲ"

# ─── タ行 ─────────────────────────────────────────────
"中堅手" = "チュウケンシュ"
"一塁手" = "イチルイシュ"
"茶帯" = "[チャオビ"
"組手" = "[クミテ]"
"合気" = "[アイキ]"
"白帯" = "[シロオビ"

# ─── ナ行 ─────────────────────────────────────────────

# ─── ハ行 ─────────────────────────────────────────────

# ─── マ行 ─────────────────────────────────────────────

# ─── ヤ行 ─────────────────────────────────────────────

# ─── ラ行 ─────────────────────────────────────────────


# ─── ア行 ─────────────────────────────────────────────

# ─── カ行 ─────────────────────────────────────────────
"高飛込" = "タカトビコミ"

# ─── サ行 ─────────────────────────────────────────────
"三日間競技" = "ミッカカンキョウギ"
"障害飛越" = "ショウガイヒエツ"

# ─── タ行 ─────────────────────────────────────────────
"吊輪" = "ツリワ"

# ─── ナ行 ─────────────────────────────────────────────

# ─── ハ行 ─────────────────────────────────────────────
"氷上" = "[ヒョウジョウ"

# ─── マ行 ─────────────────────────────────────────────
"水跳" = "ミズトビ"

# ─── ヤ行 ─────────────────────────────────────────────

# ─── ラ行 ─────────────────────────────────────────────
"籠球" = "[ロウキュウ"

# ─── 補助 ─────────────────────────────────────────────
"個人メドレー" = "コジンメドレー"

# ─── 将棋・囲碁 (盤上ゲーム) ───────────────────────────────────────
# 将棋駒名は Lindera default で誤読しやすい (角行 → カッコウ (鳥) 等)。
"角行" = "[カクギョウ"

# 拡充: 武具 (1 字)
"靫" = "[ユ]ギ" # 弓矢を入れる筒、 default ウツボ で誤発火

# 拡充 v9: 剣術流派 / 構え
"北辰一刀流" = "ホクシンイットウリュウ"  # 「一」 default イチ → イッ
"柳生新陰流" = "ヤギュウシンカゲリュウ"  # 「陰」 default イン → カゲ
"八双" = "ハッソウ"                      # 「八」 default ハチ → ハッ
"脇構" = "ワキガマエ"                    # 「構」 default コウ → ガマエ

# 拡充 v10 (2026-06-12、 柔道技、 batch-read で誤読確認済)
"大外刈" = "オオソトガリ"                # default だいがいか → 訓 (柔道)
"巴投" = "[トモエナゲ" # 「投」 default とう → なげ

# 相撲技・用語 (2026-06-19 probe)。金星=きんせい(惑星)/叩き込み=たたきこみ(一般)は homograph で見送り
"上手投げ" = "ウワテナゲ"                # 上手=うわて (bare 上手=じょうず は不干渉)
"下手投げ" = "シタテナゲ"                # 下手=したて
"徳俵" = "[トクダ]ワラ" # 俵=だわら 連濁 (default とくひょう)
"雲龍" = "[ウ]ンリュウ" # 横綱土俵入りの型/名。雲=うん (default くもりゅう)
# 相撲の決まり手 (2026-06-19 probe、掛け=がけ/反り=ぞり 連濁中心)
"河津掛け" = "カワヅガケ"      # 掛け=がけ 連濁 (default かわづかけ)
"内掛け" = "ウチガケ"          # 内=うち/掛け=がけ (default ないかけ)
"外掛け" = "[ソトガケ" # 掛け=がけ 連濁 (default そとかけ)
"居反り" = "イゾリ"            # 居=い (default きょそり)
"撞木反り" = "シュモクゾリ"    # 反り=ぞり 連濁
"上手出し投げ" = "ウワテダシナゲ"  # 上手=うわて (default じょうず)

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."足踏"]  # 射法八節 (default あしとう)
reading = "[アシブ]ミ"

[[entries."足踏".match]]
next_starts_any = ["も"]
reading = "[アシブ]ミ"

[entries."打起"]  # 同上 (default だき)
reading = "ウチオコシ"

[[entries."打起".match]]
next_starts_any = ["と"]
reading = "ウチオコシ"

[entries."飛込"]  
reading = "トビコミ"

[[entries."飛込".match]]
next_starts_any = ["も"]
reading = "トビコミ"

[entries."飛板飛込"]  
reading = "トビイタトビコミ"

[[entries."飛板飛込".match]]
next_starts_any = ["も"]
reading = "トビイタトビコミ"

