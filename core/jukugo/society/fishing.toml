# 釣り用語 (釣法・仕掛け・場・魚)
#
# 出典: 2026-09-11 専門用語一括 probe (50 語) で誤読したもの。
# 魚名 (鮃/鰈/鱸/鰤/鰆/鱚/鱧/鮟鱇) や 磯釣り/投げ釣り 系の連濁は素で正読するので非登録。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

[meta]
schema_version = "2"
role = "jukugo"

[entries]
# ★2026-09-22 パターン判定 第 1〜3 回 (2026-09-23 に general.toml から移動)
"入れ食い" = "イレグイ"
"夜釣り" = "ヨヅリ"

"船釣り" = "[フナヅリ" # 船=ふな 連濁 (default ふねづり)
"時合" = "ジアイ"          # 魚の食い気が立つ時間帯 (default ときごう)
"道糸" = "[ミチイト" # default みっし
"鉤素" = "ハリス"          # 熟字訓 (default かぎそ)
"玉網" = "タモアミ"        # default たまもう
"活け締め" = "イケジメ"    # 締め=じめ 連濁 (default いけしめ)
"波止" = "[ハト" # 波止場の 「波止」 (default なみし)
"根魚" = "ネザカナ"        # 魚=ざかな 連濁 (default ねぎょ)
