# 市町村名 (郵便番号データの正式な読み)
#
# 2026-10-02: 日本郵便の KEN_ALL の市区町村名の読みで、 全国で読みが 1 つに決まる 3 字以上の市町村名のうち、
# 現行と違うもの。 市内の町名 (町域) に同じ字で別の読みがあるもの (清水町 / 吉田町) は除く。 町 = ちょう / まち、 村 = そん / むら は自治体ごとに決まっている (七飯町 = ななえちょう)。
# 熱海市 = ねつかいし / 一関市 = いちぜきし / 名寄市 = なよせし 等の誤読も含む。 政令市の区は対象外。

