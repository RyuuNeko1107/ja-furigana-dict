# 難読姓 (苗字) の読み
#
# personal_names.toml は歴史上の人物のフルネーム / 名 が中心。
# 「姓 (苗字) 単体」 の難読 (東海林 / 栗花落 / 五十嵐 等) は別ファイルで整理する。
# 同姓で複数読みが定着しているものは代表読み 1 つを採録 (コメントで併記)。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 姓は音寄りでもカタカナ表記)
# - 読み 50 音順 を推奨
# - 1 字 surface (林 / 東 等) は unihan / kanji 領域なので入れない。

[meta]
schema_version = "2"
role = "jukugo"
description = "難読姓 (苗字) の読み (姓単体、代表読み)"

[entries]

# ★2026-09-11 内部評価コーパスで頻出 (栄冠ナインの選手名)
"高口" = "タカグチ"          # default こうこう

# ── ア行 ──
"四十物" = "アイモノ"
"飛鳥井" = "アスカイ"
"安心院" = "アジム"
"我孫子" = "アビコ"
"阿波根" = "アハゴン"
"春夏冬" = "アキナシ"
"五十嵐" = "イガラシ"
"五百旗頭" = "イオキベ"
"麻績" = "オミ"

# ── カ行 ──
"勘解由小路" = "カデノコウジ"
"上水流" = "カミズル"
"神谷" = "カミヤ"
"一尺八寸" = "カマツカ"
"鬼龍院" = "キリュウイン"
"九鬼" = "クキ"
"日下" = "クサカ"
"日下部" = "クサカベ"
"不来方" = "コズカタ"
"小比類巻" = "コヒルイマキ"
"五郎丸" = "ゴロウマル"

# ── サ行 ──
"道祖土" = "サイド"
"東海林" = "ショウジ"
"五月女" = "ソウトメ"

# ── タ行 ──
"主税" = "チカラ"
# 九十九=ツクモ は除外: 九十九日=きゅうじゅうく(99) 等 数詞用法を壊すため (homograph)
"栗花落" = "ツユリ"

# ── ナ行 ──
"仲村渠" = "ナカンダカリ"

# ── ハ行 ──
"服部" = "ハットリ"
"八十八" = "ヤソハチ"
"一二三" = "ヒフミ"
"保栄茂" = "ビン"
"八月一日" = "ホズミ"

# ── マ行 ──
"御薬袋" = "ミナイ"

# ── 濁音始まり ──
"百々" = "ドド"
"百目鬼" = "ドウメキ"
"二十楽" = "ツヅラ"
"鮎川" = "アユカワ"  # 鮎=あゆ (default あいかわ)
"鮫島" = "サメジマ"  # 鮫=さめ 連濁 (default さめしま)
"沢渡" = "サワタリ"  # (default さわわたり)
"明智" = "アケチ"  # 明智光秀/明智健悟 (default めいち)
"新垣" = "アラガキ"  # 新垣結衣等 (default しんがき)
"鬼頭" = "キトウ"    # (default おにがしら)
"胡桃坂" = "クルミザカ"  # 坂=ざか 連濁 (default くるみさか)
"左藤" = "サトウ"    # (default ひだりふじ)
"緋山" = "ヒヤマ"    # (default ひさん)
"尾上" = "オノエ"  # 歌舞伎名跡/姓 (default おがみ)

# ── 一般語と同形の姓 (gen_surname_suffix.py 生成、 default = 一般語読み) ──
"一色" = { reading = "イッショク", match = [ { next_starts_any = ["さん", "くん", "ちゃん", "君", "様", "氏", "先生", "選手", "監督", "議員"], reading = "イッシキ" } ] }  # 姓 (suffix match、 default = 一般語読み)
# ★2026-09-13: default を オオヤ → オオタニ へ反転。
# 2026-09-11 時点では 「敬称 + 文スコープの野球語」 で オオタニ に寄せていたが、
# 内部評価コーパス 3,501 行を実測すると **2,127 行が オオヤ のまま残っていた**
# (「バッター大谷」 「100 回目の大谷!」 のように trigger 語が同じ文に無い)。
# 一方 大谷石 / 大谷資料館 (地名) は 3,501 行中 **0 件**。
# よって default を人名側にし、 地名用法だけ next_starts_any で残す。
"大谷" = { reading = "オオタニ", match = [
  { next_starts_any = ["石", "資料館", "町", "採石"], reading = "オオヤ" },
] }
# ★2026-09-13: default を オタニ → コタニ へ。 「小谷」 は一般語ではなく姓のみで、
# 内部評価コーパス 651 行すべてが人物 (野球選手 / 小谷笑瓶)。 suffix 無しの裸の 「小谷」 が
# オタニ になっていた。
"小谷" = "コタニ"
"犬養" = { reading = "イヌヨウ", match = [ { next_starts_any = ["さん", "くん", "ちゃん", "君", "様", "氏", "先生", "選手", "監督", "議員"], reading = "イヌカイ" } ] }  # 姓 (suffix match、 default = 一般語読み)
"花田" = { reading = "ハナタ", match = [ { next_starts_any = ["さん", "くん", "ちゃん", "君", "様", "氏", "先生", "選手", "監督", "議員"], reading = "ハナダ" } ] }  # 姓 (suffix match、 default = 一般語読み)
"長谷" = { reading = "ナガタニ", match = [ { next_starts_any = ["さん", "くん", "ちゃん", "君", "様", "氏", "先生", "選手", "監督", "議員"], reading = "ハセ" } ] }  # 姓 (suffix match、 default = 一般語読み)

# ★2026-09-13 人物マーカー probe (「Xさん / X選手 / X投手」 の直前に来る漢字語を
# コーパスから集めて読みを検査) で見つかった誤り。
"星谷" = "ホシヤ"     # 谷 = ダニ の suffix rule に落ちて ホシダニ だった (396 行)
"名塚" = "ナツカ"     # 声優 名塚佳織。 ナヅカ だった

# ★2026-09-13 人物マーカー probe 第2弾 (10-39 回の帯)
"長尾" = "ナガオ"
"瀬川" = "セガワ"
"千賀" = "センガ"
"千賀滉大" = "センガコウダイ"
"竹達" = "タケタツ"
"竹達彩奈" = "タケタツアヤナ"
