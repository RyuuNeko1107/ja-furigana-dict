# 日本酒の銘柄 (難読の蔵元名 / 商品名)
#
# 出典: 2026-09-11 probe (53 銘柄) で誤読したもの。 銘柄名は当て字 / 訓読みが多く、
# 素の合成ではほぼ当たらない (獺祭 → かわうそさい、 而今 → じいま 等)。
#
# 一般語と衝突する銘柄は **非登録**:
#   新政 (アラマサ) … 「新政権 / 新政府」 の前方一致を壊す
#   国士無双 (コクシムソウ) / 開運 / 男山 / 大七 … 一般語読みのままで正しい
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

[meta]
schema_version = "2"
role = "jukugo"

[entries]

"獺祭" = "ダッサイ"            # default かわうそさい
"越乃寒梅" = "コシノカンバイ"  # default えつのかんばい
"而今" = "ジコン"              # default じいま
"花陽浴" = "ハナアビ"          # default かようよく
"出羽桜" = "デワザクラ"        # default でわおう
"喜久醉" = "キクヨイ"          # default よしひさすい
"志太泉" = "シダイズミ"        # default しだせん
"雨後の月" = "ウゴノツキ"      # default あめのちのつき
"司牡丹" = "ツカサボタン"      # default しぼたん
"三井の寿" = "ミイノコトブキ"  # default みついのじゅ
"繁桝" = "シゲマス"            # default はんます
"独楽蔵" = "コマグラ"          # default こまぞう
"鷹来屋" = "タカキヤ"          # default たかぎや
"鍛高譚" = "タンタカタン"      # 焼酎 (default たんたかはなし)
"千歳鶴" = "チトセヅル"        # default せんさいつる
"墨廼江" = "スミノエ"          # default すみすなわちえ
"冩楽" = "シャラク"            # default うつすらく
"弥右衛門" = "ヤエモン"        # default やみぎえもん
"栄川" = "エイセン"            # default えいがわ
"喜久酔" = "キクヨイ"

# --- 焼酎 / 泡盛 (★2026-09-11 probe 50 銘柄) -------------------------------
"伊佐美" = "イサミ"            # default いさび
"兼八" = "カネハチ"            # default けんはち
"富乃宝山" = "トミノホウザン"  # default ふのたからやま
"吉兆宝山" = "キッチョウホウザン"
"一刻者" = "イッコクモン"      # default いっこくしゃ
"泡波" = "アワナミ"            # 与那国の泡盛 (default あわは)
"菊之露" = "キクノツユ"        # default きくのろ
"残波" = "ザンパ"              # default ざんは
"千代泉" = "チヨイズミ"        # default ちよせん
"玉友" = "ギョクユウ"          # default たまとも
"龍宮" = "リュウグウ"          # 黒糖焼酎 / 竜宮 (default りゅうきゅう = 琉球との混同)
"蕎麦焼酎" = "ソバジョウチュウ"  # 焼酎=じょうちゅう 連濁 (default そばしょうちゅう)

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."天吹"]  # default てんすい
reading = "アマブキ"

[[entries."天吹".match]]
next_starts_any = ["か"]
reading = "アマブキ"

