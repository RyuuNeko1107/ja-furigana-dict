# === match_hits condition weighting (lib 0.1.11) 連動 sweep (2026-06-12) ===
# lib の match_hits tie-break 導入で、 broad 条件 ([[kanji]] の char_type / starts_any)
# が同点 path を制し既存読みが変わった分の補正。 いずれも一般語の正規 entry
# (= 1 edge の dict_exact が edge_count で split path に構造的に勝つ)。
# 916k corpus A/B diff (matchhits gate 実測) 由来、 各 1 行以上の実出現。
"複数人" = "フクスウニン"     # 人=ひと match (next 助詞) が 複+数人 tie を逆転していた
"村社会" = "ムラシャカイ"     # 村=ソン match (next 漢字) 対策
"一手間" = "[ひと]てま" # 一手+間 / 一+手間 split 対策
"最後尾" = "サイコウビ"       # 最後+尾 split (さいごお) 対策
"度目" = "ドメ"               # 度+目 (どもく) split 対策
"何度目" = "ナンドメ"         # 何度+目 (なんどもく) と 度目 が tie になるため exact 登録
"年代物" = "ネンダイモノ"     # 年代+物 (ねんだいぶつ) 対策
"一点物" = "イッテンモノ"     # 一点+物 (旧 いちてんぶつ、本番VV)
"卵形" = "[タマゴガタ" # native+形=がた (prev=漢字→ケイ 誤射、本番VV)
"星形" = "[ホシガタ" # 同上
"旅行先" = "リョコウサキ"     # 旅行+先 (りょこうせん) 対策
"百人力" = "ヒャクニンリキ"   # 百+人力 / 人+力 split 対策
"火星人" = "カセイジン"       # 火星+人 (かせいひと) 対策
"一番手" = "イチバンテ"       # 一番+手 (いちばんしゅ) 対策
"地帯" = "[チ]タイ" # 「山岳地帯」 等、 Lindera compound (band 150) 頼みだった分を entry 化
"天馬" = "[テ]ンマ" # 天+馬 (てんうま) / 天馬=てんば 対策
"小人数" = "コニンズウ"       # 小人 (こびと) + 数 split 対策

# === 組 連濁 round (2026-06-12): [[kanji]] 組 の ぐみ match 連動 ===
"星組" = "[ホシグミ" # 星 default セイ のため match だけでは せいぐみ (宝塚/園クラス)
"月組" = "[ツキグミ" # 月 default ゲツ 同上
"組数" = "[クミス]ウ" # ぐみ match の誤爆防止 (「チャレンジ組数」 等、 組+数 は くみすう)
"何人目" = "ナンニンメ"       # 何人+目 (なんにんもく) split 対策 (何度目 と同型)

# === 箱/玉 連濁 round (2026-06-12): [[kanji]] ばこ/だま match 連動 ===
"おもちゃ箱" = "[オモチャ]バコ" # ひらがな prev は char_type match 禁止のため entry で
"空箱" = "[カラバコ" # 空=そら default のため match だけでは そらばこ
"紅玉" = "[コウギョク" # 同上 (リンゴ品種/宝石)
"白玉" = "[シラタマ" # 連濁なし たま の例外
"勾玉" = "[マガタマ" # 同上
"味玉" = "アジタマ"           # 同上 (ラーメン)
"釜玉" = "[カマタマ" # 同上 (うどん)
"一玉" = "ヒトタマ"           # 同上 (うどん/スイカ 一玉、 いちぎょく/いちだま 両方誤り)
"出玉" = "[デダマ" # パチンコ用語 (しゅつぎょく/しゅつだま 両方誤り)

# === 係 default flip (ケイ → かかり) 連動: 音「ケイ」 の閉じた jukugo 集合 (2026-06-12) ===
# 関係者/無関係/人間関係 等は 関係 entry の連結で自動。 受付係/記録係/書記係 の個別
# entry は flip 後の prev_char_type=漢字 → がかり match で冗長化したため削除済
"関係" = "[カンケイ"
"係数" = "[ケイス]ウ"
"係留" = "[ケイリュウ"
"係争" = "[ケイソウ"
"連係" = "[レンケイ"

# 大/小 接頭辞語 + 慣用句 (★agent×probe 2026-07-06)
"諸刃の剣" = "モロハノツルギ"
"小恥ずかしい" = "コッパズカシイ"
"大店" = "[オオダナ"

# 「長押」 = ナゲシ (建築) だが、 後ろに 「し」 が来れば ボタンの 長押し。
# entry にしておくと 長押しかな / 長押しする のように Lindera が 長押|しかな と
# 割る形でも ナガオ + シカナ で正しく読める (★2026-09-18 engine_diff)
# 「月末」 は単独なら ゲツマツ、 数字の後ろ (8月末) は ガツマツ
[entries."月末"]
reading = "ゲツマツ"

[[entries."月末".match]]
reading = "ガツマツ"
prev_char_type = "英数"

[entries."長押"]
reading = "ナゲシ"

[[entries."長押".match]]
reading = "ナガオ"
next_starts_any = ["し"]

[entries."上手"]
reading = "ジョウズ"

[[entries."上手".match]]
reading = "カミテ"
next_eq = "から"

# 「上手い / 上手く / 上手かった / 上手さ / 上手すぎる」 形容詞活用 → ウマ
[[entries."上手".match]]
reading = "ウマ"
next_starts_any = ["い", "く", "か", "さ", "す"]

[[entries."上手".alt]]
reading = "カミテ"
sense = "stage-left"
weight = 30

[[entries."上手".alt]]
reading = "ウワテ"
sense = "superior"
weight = 20

[entries."下手"]
reading = "ヘタ"

[[entries."下手".alt]]
reading = "シモテ"
sense = "stage-right"
weight = 30

[entries."人気"]
reading = "ニンキ"

# 「が無い/が無かった/がない/がなかった」 で否定 → 「ヒトケ」 (= 人気が無い場所)
# next_logical_token は char-class 連続を 1 pseudo-token として返すので、
# 「がない」 全体を next_eq_any で列挙する (= next_eq "が" だと "がない" ≠ "が" で失敗)
[[entries."人気".match]]
reading = "ヒトケ"
next_eq_any = ["がない", "がなかった"]

[[entries."人気".match]]
reading = "ヒトケ"
next_eq_any = ["のない", "のなかった"]

[[entries."人気".match]]
reading = "ヒトケ"
next_eq_any = ["が"]
next2_starts_any = ["無"]

[[entries."人気".match]]
reading = "ヒトケ"
next_eq_any = ["の"]
next2_starts_any = ["無"]

[[entries."人気".alt]]
reading = "ヒトケ"
sense = "sign-of-people"
weight = 25

# 「細々」 default 「こまごま」 (= 「細々と説明する / 細々とした作業」)。
# 「細々と暮らす/生きる/続ける/営む」 は「ほそぼそ」 (= 慎ましく/かろうじて の意)
