# ★2026-09-19: 「もう漁ってるww」 が Lindera の 漁って (スナドッテ) に同点負けする
[entries."漁って"]
reading = "アサッテ"

[[entries."漁って".match]]
next_starts_any = ["る", "た", "い", "ん", "ま", "く", "w"]
reading = "アサッテ"

# ★2026-09-19: 文中で entry が周辺 token に負ける分の tie-break (読みは default と同じ)
[entries."野次"]
reading = "ヤジ"

[[entries."野次".match]]
next_starts_any = ["が", "を", "は", "に", "も", "で", "と"]
reading = "ヤジ"


[entries."叩き"]  # Lindera の 叩き (ハタキ) に取られる
reading = "タタキ"

[[entries."叩き".match]]
next_starts_any = ["そ", "た", "ま", "つ", "に", "な", "は", "が", "を", "方", "込", "落", "潰", "台"]
reading = "タタキ"

[entries."大分"]  # ★2026-09-19: 副詞 だいぶ が主、地名は文脈で
reading = "ダイブ"

[[entries."大分".match]]
next_starts_any = ["県", "市", "駅", "弁", "空港", "出身", "産", "人", "大学", "トリニータ", "行", "在住", "民", "組"]
reading = "オオイタ"

[entries."断捨離"]  # ★2026-09-19: 断捨 + 離して に割れる
reading = "ダンシャリ"

[[entries."断捨離".match]]
next_starts_any = ["し", "す", "で", "は", "を", "が", "の", "し", "っ", "中", "系"]
reading = "ダンシャリ"

[entries."強かろ"]  # Lindera の 強か (シタタカ) に取られる
reading = "ツヨカロ"

[[entries."強かろ".match]]
next_starts_any = ["う"]
reading = "ツヨカロ"
