reading = "[キ]ザ"

[entries."毎分"]  
reading = "[マイフン"

[[entries."毎分".match]]
next_starts_any = ["と", "の", "か"]
reading = "[マイフン"

[entries."値引"]  # === batch 8 (= 哲学・知 / 緊急対応 / 災害 / 物理 / 機械 / 統計 / 宗教 /
reading = "[ネビキ"

[[entries."値引".match]]
next_starts_any = ["か"]
reading = "[ネビキ"

[entries."立読"]  
reading = "タチヨミ"

[[entries."立読".match]]
next_starts_any = ["も"]
reading = "タチヨミ"

[entries."第二次"]  # === batch 9 (= 工事・環境 / 情報通信 / 軍事 / 比較 / 評価 / 仕事 / 製造 /
reading = "ダイニジ"

[[entries."第二次".match]]
next_starts_any = ["も"]
reading = "ダイニジ"

[entries."彼此"]  
reading = "[カ]レコレ"

[[entries."彼此".match]]
next_starts_any = ["の"]
reading = "[カ]レコレ"

[entries."宝玉"]  # 玉 の prev漢字 match を ギョク → だま 反転した分の例外
reading = "[ホウギョク"

[[entries."宝玉".match]]
next_starts_any = ["の"]
reading = "[ホウギョク"

[entries."小過"]  
reading = "[ショ]ウカ"

[[entries."小過".match]]
next_starts_any = ["と"]
reading = "[ショ]ウカ"

