# Lindera が 「熟語 + か」 を割る型の guard。
#
# 「判定かな?」 のように文末記号が付くと Lindera は 「判 + 定か (サダカ)」 と切る。
# この時 2 つの path は weakest_band も edge 数も同点になり (かな edge が必ず 1 本乗るため
# weakest は 50 に張り付く)、 熟語側が負けて はんさだ になる。 entry に match condition を
# 1 つ持たせて match_hits で tie を破る = 読みは default と同じで、 次が 「か」 の時だけ発火。
#
# 対象は 2 字目が 「〜か」 の訓 (定か / 確か / 静か / 細か / 愚か / 密か) を持つ熟語。

[meta]
schema_version = "2"
role = "jukugo"
description = "Lindera の 「熟語 + か」 分割に負けないための tie-break entry"

[entries]
[entries."安定"]
reading = "アンテイ"

[[entries."安定".match]]
next_starts_any = ["か"]
reading = "アンテイ"

[entries."指定"]
reading = "シテイ"

[[entries."指定".match]]
next_starts_any = ["か"]
reading = "シテイ"

