# 慣用句・ことわざ (難読読み)
#
# 「急がば回れ」「猿も木から落ちる」のような句単位で読みが固まっている
# 慣用句・ことわざを集約。general.toml は単語、ここはフレーズ単位。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)
# - 50 音順 を推奨

[meta]
schema_version = "2"
role = "jukugo"
description = "慣用句 / ことわざ / 故事成語 (フレーズ単位)"

