# 音楽用語の難読読み (ジャンル / 楽器 / 音楽記号 / 音楽論)
#
# 既存 arts.toml に「三味線 / 琵琶 / 尺八 / 太鼓 / 雅楽 / 篳篥 / 能管 / 横笛 /
# 大鼓 / 小鼓 / 三線 / 締太鼓 / 和太鼓 / 歌舞伎 / 浄瑠璃 / 文楽 / 落語 / 漫才」など
# 古典楽器 / 古典芸能がある。ここはそれ以外の音楽用語 (西洋楽器 / ジャンル / 楽典)。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)
# - 50 音順 を推奨

[meta]
schema_version = "2"
role = "jukugo"
description = "音楽ジャンル / 楽典 / 楽器 / 演奏 / 音楽用語"

