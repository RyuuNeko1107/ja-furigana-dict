# 旧表記・当て字の和語と、 古い漢字表記の一般語 (青空文庫の原文ルビ由来、 2026-09-25)
#
# 青空文庫の作者・入力者ルビ (3 作品以上で一貫、 ひらがなルビのみ) と現行の読みを比べ、 現代でも標準の読みで
# 現行が誤読していたものだけを採録 (呶鳴 = どな / 綽名 = あだな / 鍍金 = めっき / 凸凹 = でこぼこ)。
# 文学的な当て読み (生命 = いのち / 他人 = ひと / 呼吸 = いき) と、 現代で別の読みが標準の語 (行末 / 分別 / 礼拝 / 日々) は採らない。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

