# 農業 / 園芸用語 (栽培・圃場・鳥獣害)
#
# 出典: 2026-09-11 専門用語一括 probe (59 語) で誤読したもの。
# 田植え / 代掻き / 籾摺り / 接ぎ木 等の基本語は素で正読するので非登録。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

[meta]
schema_version = "2"
role = "jukugo"

[entries]

"人工授粉" = "ジンコウジュフン"  # 粉=フン (default じんこうじゅこ)
"水耕" = "スイコウ"              # 水耕栽培 (default みずこう)
"水耕栽培" = "スイコウサイバイ"
"獣害" = "ジュウガイ"            # default けものがい
"獣害対策" = "ジュウガイタイサク"
