# 登山用語 (地形・行動・装備)
#
# 出典: 2026-09-11 専門用語一括 probe (59 語) で誤読したもの。
# 稜線 / 鞍部 / 雪庇 / 藪漕ぎ / 九十九折 等は素で正読するので非登録。
#
# ★「X場」 の 「場」 は default バ だが、 [[kanji]] block が
#   「prev 漢字 → ジョウ」 「prev カタカナ → ジョウ」 の match を持つため
#   (ゴルフ場 / 工場 が正しく読めるように)、 訓読みの 「〜バ」 は entry で覆う。
#
# - key (表層): ダブルクォート必須
# - value (読み): ひらがな または 全角カタカナ (慣習: 訓=ひら / 音=カタ)

[meta]
schema_version = "2"
role = "jukugo"

[entries]

"天場" = "テンバ"          # 幕営適地 (default てんじょう)
"幕場" = "マクバ"          # default まくじょう
"鎖場" = "[クサリバ" # default くさりじょう
"水場" = "[ミズバ" # default みずじょう
"ガレ場" = "ガレバ"        # カタカナ + 場 (default ガレじょう)
"ザレ場" = "ザレバ"
"主稜" = "[シュリョウ" # default ぬしりょう
"沢登り" = "[サワノ]ボリ" # default たくのぼり
"高巻き" = "[タカマ]キ" # 滝を迂回する (default こうまき)
"直登" = "[チョクトウ" # default なおと
"熊鈴" = "クマスズ"        # default くまりん
"熊除け" = "クマヨケ"      # default くまのけ
