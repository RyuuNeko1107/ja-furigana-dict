# 英文の中でだけ使う語 (a / is / to / you …)
#
# 短い語 (1〜3 字の機能語) は、 単独で登録すると日本語の中の `to` `so` `is` `no` を壊すので [entries] には置かない。
# ここ ([sentence_words]) の語は、 次の場合だけ引かれる:
#   - 空白でつながった複数語の英字 (thank you so much / I love you) の 1 語として
#   - 空白なしの連結 (thankyou / iloveyou / GameOver) を辞書の語に区切った 1 部分として
# 単独の `to` `so` `is` は引かれない (従来どおり英字のまま)。 読みは全角カタカナ。
# 内容語 (thank / love / much 等) は通常どおり [entries] (english.toml 等) に置く。

[meta]
schema_version = "2"
role = "loanwords"
description = "英文の中でだけ使う語 (a / is / to / you 等の機能語。 単独では引かない)"

