# ぶいすぽっ! (VShojo? いや ブシロード系 NIJI… 正式: ぶいすぽっ!/VSPO!) の所属タレント名
#
# 出典: 『ぶいすぽっ!』公式メンバー一覧。一ノ瀬うるは/橘ひなの/胡桃のあ 等
# IPADIC 正読は非登録、難読姓のみ補充。

[meta]
schema_version = "2"
role = "works"
description = "ぶいすぽっ! : タレント名 (公式読みベース)"

[entries]

"英リサ" = "ハナブサリサ"      # 英=はなぶさ (default えい)
"空澄セナ" = "アスミセナ"      # 空澄=あすみ (default そらちょう)
"紫宮" = "シノミヤ"            # 紫宮るな (default むらさききゅう)
"神成" = "カナル"              # 神成きゅぴ (default かみなり)
"小雀" = "コスズメ"            # 小雀とと (default こがら)

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."兎咲"]  # 兎咲ミミ (default うさぎさ、ミミは passthrough)
reading = "トサキ"

[[entries."兎咲".match]]
next_starts_any = ["か"]
reading = "トサキ"

