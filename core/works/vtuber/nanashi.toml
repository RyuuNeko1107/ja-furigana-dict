# ななしいんく (VTuber事務所) の所属タレント名
#
# 出典: 『ななしいんく』公式。因幡はねる/宗谷いちか 等 IPADIC 正読は非登録。

[meta]
schema_version = "2"
role = "works"
description = "ななしいんく : タレント名"

[entries]

"杏戸" = "キョウド"            # 杏戸ゆげ (default あんずこ)
"柚原" = "ユズハラ"            # 柚原いづみ (default ゆはら)

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."季咲"]  # 季咲あんこ (咲=さき)
reading = "キサキ"

[[entries."季咲".match]]
next_starts_any = ["か"]
reading = "キサキ"

