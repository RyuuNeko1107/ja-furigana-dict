# きらら系アニメ (けいおん/ゆるキャン/まちカドまぞく/きんいろモザイク 等) のキャラクター名

[meta]
schema_version = "2"
role = "works"
description = "きらら系アニメ: キャラクター名"

[entries]

"各務原なでしこ" = "カガミハラナデシコ"  # ゆるキャン (各務原市=かかみがはら と別)
"千代田桃" = "チヨダモモ"    # まちカドまぞく 桃=もも (default とう)
"陽夏木" = "ヒナツキ"        # まちカド 陽夏木ミカン (default ようなつき)
"大宮忍" = "オオミヤシノブ"  # きんモザ 忍=しのぶ (default にん)
"小路綾" = "コミチアヤ"      # きんモザ 小路=こみち (default しょうじ)

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."琴吹"]  # けいおん 琴吹紬 (default ことすい)
reading = "コトブキ"

[[entries."琴吹".match]]
next_starts_any = ["か"]
reading = "コトブキ"

