# フルーツバスケット (高屋奈月 / 白泉社) のキャラクター名
#
# 出典: 高屋奈月『フルーツバスケット』(白泉社 花とゆめコミックス) / アニメ公式
#
# 採録方針 (works 共通): 公式に読みが確定しているキャラ / 用語のみ、全 surface ≥2 文字、単漢字は入れない

[meta]
schema_version = "2"
role = "works"
description = "フルーツバスケット (高屋奈月): キャラクター名"

[entries]

"草摩" = "ソウマ"          # 草摩家 (default くさま)
"本田透" = "ホンダトオル"  # 透=とおる (default とう)

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."草摩夾"]  # 夾=きょう (default はさむ)
reading = "ソウマキョウ"

[[entries."草摩夾".match]]
next_starts_any = ["も"]
reading = "ソウマキョウ"

[entries."草摩紫呉"]  # 紫呉=しぐれ (default しご)
reading = "ソウマシグレ"

[[entries."草摩紫呉".match]]
next_starts_any = ["に"]
reading = "ソウマシグレ"

