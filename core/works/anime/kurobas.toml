# 黒子のバスケ (藤巻忠俊 / 集英社) のキャラクター名
#
# 出典: 藤巻忠俊『黒子のバスケ』(集英社) / アニメ。黒子テツヤ=くろこ は
# bare 黒子=ほくろ と homograph のため非登録 (フルネームはカタカナ部含むため保留)。

[meta]
schema_version = "2"
role = "works"
description = "黒子のバスケ (藤巻忠俊): キャラクター名"

[entries]

"緑間真太郎" = "ミドリマシンタロウ"  # 緑間=みどりま (default みどりかん)
"紫原敦" = "ムラサキバラアツシ"      # 紫原=むらさきばら (default むらさきげん)
"火神大我" = "カガミタイガ"          # 火神=かがみ (default ひしん)
"灰崎祥吾" = "ハイザキショウゴ"      # 灰崎=はいざき (default はいさき)
"日向順平" = "ヒュウガジュンペイ"    # 日向=ひゅうが (bare 日向=ひなた homograph)
# 2026-06-19 probe 補充
"木吉" = "キヨシ"              # 木吉鉄平 (default ききち)
"木吉鉄平" = "キヨシテッペイ"
"花宮" = "ハナミヤ"            # 花宮真 (default はなきゅう)
"実渕" = "ミブチ"              # 実渕玲央 (default じつふち)
"実渕玲央" = "ミブチレオ"
"根武谷永吉" = "ネブヤエイキチ"  # 根武谷=ねぶや (default ねたけや)
"黛千尋" = "マユズミチヒロ"    # 黛=まゆずみ (default たい)
"黄瀬涼太" = "キセリョウタ"    # 黄瀬=きせ (default きのせ)
"緑間" = "ミドリマ"  # 緑間真太郎 (default みどりかん)
"黒子のバスケ" = "クロコノバスケ"  # 黒子=くろこ (default ほくろ)
"黒子テツヤ" = "クロコテツヤ"      # 主人公 黒子=くろこ

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."花宮真"]  
reading = "ハナミヤマコト"

[[entries."花宮真".match]]
next_starts_any = ["に"]
reading = "ハナミヤマコト"

