# 食戟のソーマ (附田祐斗・佐伯俊 / 集英社) のキャラクター名

[meta]
schema_version = "2"
role = "works"
description = "食戟のソーマ: キャラクター名"

[entries]

"幸平創真" = "ユキヒラソウマ"  # 創真=そうま (default そうしん)
"田所恵" = "タドコロメグミ"  # 恵=めぐみ (default けい)
"新戸" = "シントメ"        # 新戸緋沙子 (default しんと。旧 アラト は誤)
"新戸緋沙子" = "シントメヒサコ"  # 緋沙子=ひさこ
"遠月" = "トオツキ"        # 遠月学園 (default えんげつ)
"十傑" = "ジュッケツ"      # (default じゅうけつ)

# ★2026-09-18: 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「北野武は」 → きたのたけは)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."薙切"]  # 薙切えりな/薙切薊 (default なぎきり。旧 ナギキリ は誤)
reading = "ナキリ"

[[entries."薙切".match]]
next_starts_any = ["に"]
reading = "ナキリ"

# ★ 助詞が続くと Lindera の分割に同点負けする entry の tie-break
# (「取説か」 → しゅせつか)。 読みは default と同じで、 match_hits で同点を破るだけ。

[entries."幸平"]  # 幸平創真 (default こうへい)
reading = "ユキヒラ"

[[entries."幸平".match]]
next_starts_any = ["が"]
reading = "ユキヒラ"

