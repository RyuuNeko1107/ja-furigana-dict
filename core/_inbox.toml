"経験値" = "ケイケンチ"
"三位一体" = "サンミイッタイ"
"出落ち" = "デオチ"
"地下水" = "チカスイ"
"小便器" = "ショウベンキ"
"玉子" = "タマゴ"
"何人前" = "ナンニンマエ"
"熱すぎ" = "アツスギ"
