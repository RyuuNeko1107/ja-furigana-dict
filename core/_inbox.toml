"年明け早々" = "トシアケソウソウ"
"不用心" = "ブヨウジン"
"巌流" = "ガンリュウ"
"出来る" = "デキル"  # 下の 来る entry が 出来る を 出 + 来る に割るのを防ぐ
"出来なさそう" = "デキナサソウ"
"転がせ" = "コロガセ"
"転がし" = "コロガシ"
"転がす" = "コロガス"
"入りま" = "ハイリマ"  # 「X入りまーす / 入ります」 (IPADIC は イリ)
"入りそう" = "ハイリソウ"
"入りすぎ" = "ハイリスギ"
"入りながら" = "ハイリナガラ"
"滅入りそう" = "メイリソウ"  # 上の 入りそう が 気が滅入りそう を割るのを防ぐ
"二の間" = "ニノマ"  # 死んでいた prev_ends_any = "二の" の代わり
"同い歳" = "オナイドシ"
"心中お察し" = "シンチュウオサッシ"
"中和" = "チュウワ"  # 「中和w」 が 中 + 和 に割れて ちゅうか になる
"極め" = "キワメ"  # IPADIC の 極め = キメ (決め) に取られる
"見極め" = "ミキワメ"  # 上の entry が 見 + 極め と割るのを防ぐ
"別日" = "ベツジツ"  # 別 + 日(ヒ) に割れて促音便 pass が ベッピ にしていた
"組み立て" = "クミタテ"  # IPADIC の 「組み立」 が読み クミタテ を持ち くみたてててる になる
"野崎" = "ノザキ"  # 連濁。 default 合成で のさき になっていた
"青赤" = "アオアカ"  # 赤 の prev 漢字 rule で セキ に落ちる (TCG の色名)
"そこら中" = "ソコラジュウ"

[entries."忍法帖"]  # ★2026-09-18: 旧 「忍法帖+助詞」 形式から移設
reading = "ニンポウチョウ"

[[entries."忍法帖".match]]
next_starts_any = ["が"]
reading = "ニンポウチョウ"


[entries."満帆"]  # ★2026-09-18: 旧 「満帆+助詞」 形式から移設
reading = "マンパン"

[[entries."満帆".match]]
next_starts_any = ["が"]
reading = "マンパン"





[entries."夏草"]  # ★2026-09-18: 旧 「夏草+助詞」 形式から移設
reading = "ナツグサ"

[[entries."夏草".match]]
next_starts_any = ["の"]
reading = "ナツクサ"

# ★ 2026-09-18: entry が周辺文字で負ける分 (match_hits で同点を破る)
[entries."高杉"]
reading = "タカスギ"

[[entries."高杉".match]]
prev_char_type = "カタカナ"
reading = "タカスギ"

[entries."来る"]  # ★2026-09-23: IPADIC の連体詞 来る = キタル が動詞にも出る。 来る 10 日 / 来る十日 だけ キタル
reading = "クル"

[[entries."来る".match]]
next_digit = true
reading = "キタル"

[[entries."来る".match]]
next_starts_any = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"]
reading = "キタル"
