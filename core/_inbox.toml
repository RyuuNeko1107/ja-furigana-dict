"煽り" = "アオリ"  # IPADIC 煽り = アフリ
"荒ぶ" = "アラブ"  # IPADIC 荒ぶ = スサブ
"疑っ" = "ウタガッ"  # IPADIC 疑っ = ウタグッ
"気を遣っ" = "キヲツカッ"  # IPADIC 遣っ = ヤッ。 遣っ 単体は 遣って来る / 遣っちまった (やっ) を壊すので 気を に限る
"経て" = "ヘテ"  # IPADIC 経て = タテ (7年も経てば)
"行け行け" = "イケイケ"
"足速" = "アシハヤ"
"頭打っ" = "アタマウッ"
