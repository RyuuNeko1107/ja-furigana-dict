# 得れば/得れる: 可能形。 Lindera が 得れ を うれ と読んでいた (ひとつ得れば)
# 次男くん/三男さん: 続柄。 Lindera の人名 (つぐお/みつお) に取られていた
# 残り〇分: 直前が漢字混在の 残り だと 分 の規則が効かず ぶ/ぷん が崩れていた (残り四分=のこりよんぶん)
# チー牛: ネットスラング。 牛 が うし と読まれていた
# 書き: 名詞のあとで 連濁 (がき) になっていた。 小説書き・文字書き・文章書き は 書く人/書く動作で かき (箇条書き・メモ書き・殴り書き・試し書き は がき のまま)
# やり辛い: 連濁で やりづらい (つらい と読まれていた。 言い辛い/使い辛い 等は既に づらい)
# 勝ちまくり: 直前がカタカナだと 勝ち が がち (連濁) に読まれていた
# 辛い: 既定は つらい。 食べ物の話題の文なら からい (Lindera の 辛い=つらい に 辛 の [[kanji]] 規則が負けるため entry で扱う)
