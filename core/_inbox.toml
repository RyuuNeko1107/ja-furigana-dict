[meta]
schema_version = "2"
role = "jukugo"
description = "分類前の一時 inbox (≥2 字 surface、 内容が貯まったら適切な genre dir に振り分ける)"

# 使い方:
# - 「読みは追加したいが、 どの genre dir (basic / nature / society / 等) に
#   入れるべきか判断付かない」 ときに 1 行追加してここに置く。
# - PR レビュー or maintainer の整理タイミングで適切な
#   `core/jukugo/<genre>/<file>.toml` に移動する。
# - 単漢字 (1 字 surface) は **入れない** (validate.py が cross-file 重複として fail させる、
#   `core/unihan/<水準>.toml` 専用領域)。
# - 外来語 (英字始まり surface) も **入れない** (`core/loanwords/` 専用領域、
#   role が違うため lib が jukugo として誤って load する)。

[entries]
"二の間" = "ニノマ"  # 死んでいた prev_ends_any = "二の" の代わり
"同い歳" = "オナイドシ"
"心中お察し" = "シンチュウオサッシ"
"中和" = "チュウワ"  # 「中和w」 が 中 + 和 に割れて ちゅうか になる
"極め" = "キワメ"  # IPADIC の 極め = キメ (決め) に取られる
"見極め" = "ミキワメ"  # 上の entry が 見 + 極め と割るのを防ぐ
"別日" = "ベツジツ"  # 別 + 日(ヒ) に割れて促音便 pass が ベッピ にしていた
"組み立て" = "クミタテ"  # IPADIC の 「組み立」 が読み クミタテ を持ち くみたてててる になる
"野崎" = "ノザキ"  # 連濁。 default 合成で のさき になっていた
"青赤" = "アオアカ"  # 赤 の prev 漢字 rule で セキ に落ちる (TCG の色名)
"そこら中" = "ソコラジュウ"

[entries."忍法帖"]  # ★2026-09-18: 旧 「忍法帖+助詞」 形式から移設
reading = "ニンポウチョウ"

[[entries."忍法帖".match]]
next_starts_any = ["が"]
reading = "ニンポウチョウ"


[entries."満帆"]  # ★2026-09-18: 旧 「満帆+助詞」 形式から移設
reading = "マンパン"

[[entries."満帆".match]]
next_starts_any = ["が"]
reading = "マンパン"





[entries."夏草"]  # ★2026-09-18: 旧 「夏草+助詞」 形式から移設
reading = "ナツグサ"

[[entries."夏草".match]]
next_starts_any = ["の"]
reading = "ナツクサ"

# ★ 2026-09-18: entry が周辺文字で負ける分 (match_hits で同点を破る)
[entries."高杉"]
reading = "タカスギ"

[[entries."高杉".match]]
prev_char_type = "カタカナ"
reading = "タカスギ"


