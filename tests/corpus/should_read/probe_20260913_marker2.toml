# 2026-09-13 マーカー probe 第2弾。 人物マーカーに続いて
# 地名マーカー (駅/市/県/町/村/区/島/山/川/寺/神社/温泉/城) と
# コミュニティ接尾辞 (民/組/勢/班/界隈/沼) の直前語を検査した。
# ★実バグは 神室町 = カムロマチ の 1 件のみ (龍が如くの舞台。 正しくは カムロチョウ)。
#   地名 38 種 / コミュニティ 61 種は他すべて正読 = この 2 つの vein は薄い。

