# カタカナ隣接 rule はあるのに英数隣接 rule が無かった字の回帰。
# 英数 は数字も含むので、 数字 + 組 = くみ (助数詞) と 中々 を割らないことも固定する。
# 時 は 数字 + 時 の助数詞経路を奪うので対象外にした (5時 = ごじ のまま)。

[[case]]
input = "EN勢の"
mode = "hiragana"
expected = "ENぜいの"

