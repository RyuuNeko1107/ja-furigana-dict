# 2026-09-13 VOICEVOX 比較 第4巡。 常用外漢字を含む行 (12.4 万行) から 3,000 行
# 採取 (一致 84.5%、 DIFF 466 件を triage)。
# ★力 / 時 はカタカナ直後も音読み (フィニッシュ力 / ライブ時)。
# ★度 は 「する度に」 が ドニ。 ただし レア度は / やりこみ度は を壊さないよう
#   助詞は 「に」 だけに絞り、 数字 / 漢語 / カタカナ直後は先に ド で確定させる。
# ★鞭 は default を ムチ へ (飴と鞭 が アメトベン だった)。

