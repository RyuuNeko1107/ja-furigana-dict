# 2026-11-01 第 22 回 (Wikipedia の標本 1,500 文、 不一致 546 行)。
# 判定者 (サブエージェント) の主張を、 現行 lib への引き直しと、 独立 2 系統 (UniDic / Sudachi) との照合で絞り、 実コメントでの出現数も見て、
# 一致したものだけを辞書に入れた。 Wikipedia の語は実コメントにはほぼ出ないが、 冠名 (競馬) / 中経出版 / 王弟 / 昼行便 は実コメントでも出ていた。
# 人名の個別の読み、 学校名・路線名、 文脈で割れる語 (継母 = ままはは / けいぼ、 心底 = しんそこ) は入れなかった。
# 若衆 は既存の見出し (ワカイシュ) があり、 実コメントの用例だけでは決めきれないので触らない。

[[case]]
input = "冠名設定できますよ"
mode = "hiragana"
expected = "かんむりめいせっていできますよ"
note = "冠名=かんむりめい (競馬の馬名の冠。 旧: かんめい。 実コメント 13 行)"

