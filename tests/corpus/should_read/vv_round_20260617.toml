input = "ぶっ放す"
mode = "hiragana"
expected = "ぶっはなす"
note = "旧 ぶっほかす (Lindera 放す=ほかす)。本番 signal"

[[case]]
input = "放つ"
mode = "hiragana"
expected = "はなつ"

[[case]]
input = "突き放す"
mode = "hiragana"
expected = "つきはなす"

[[case]]
