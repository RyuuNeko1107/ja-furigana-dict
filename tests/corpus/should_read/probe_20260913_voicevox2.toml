# 2026-09-13 VOICEVOX 比較 第2巡 (3,000 行 / 一致 85.6%)。
# ★三世は 現代語の序数読み (ルパン三世) を default にし、 仏教語 サンゼ は
#   後続語で分岐。 「三世の因果」 は next_eq の + next2 で拾う。
# ★版 はカタカナ・英数直後も バン (ベータ版 / PS版)。 ギリシャ文字は
#   prev_char_type に乗らないので β版 / α版 は entry で押さえる。
# ★外出て (58 行) を取るため、 衝突する 案外出て (2 行) も明示 entry にした。

