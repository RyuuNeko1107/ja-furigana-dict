# 2026-09-18 lib: 1 字だけ切り出された一段動詞語幹 (寝|ん / 見|終わ) の読み の回帰 lock。
# lib lindera_fallback の verb_stem 格上げ (直後が助動詞/接続助詞/非自立動詞、 直前が漢字/お/ご でない、 得 除外)。

[[case]]
input = "寝んな"
mode = "hiragana"
expected = "ねんな"
note = "旧 しんんな。lib: 1 字一段動詞語幹 (Lindera 寝|ん) の読み"

