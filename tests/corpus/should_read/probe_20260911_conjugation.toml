# 2026-09-11 活用形監査。 辞書の動詞 / 形容詞 entry から活用形を機械生成し、
# 語幹の読みが保たれるかを検査した (740 + 728 形)。
# ★終止形は正読でも **活用形だけ Lindera の別読みに負ける** 語が多数あった。
# 連語 entry (我を通す / 轍を踏む / 床に就く) は活用形も併せて登録する。

