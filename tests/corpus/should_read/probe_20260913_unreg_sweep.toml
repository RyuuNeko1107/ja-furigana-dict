# 2026-09-13 未登録漢字語 2,500 語を VOICEVOX と総当たり (不一致 237)。
# ★ほぼ全てが動詞語幹の断片 (見逃 / 片付 / 空気読 …) か VV 側の誤読で、
#   実バグは 「一味」 1 件だけだった = この vein は飽和と確認できた。
# 一味: 実データ 2,464 件中 2,280 件が イチミ (海賊の一味 / ホロライブのファン名)。
#   「ひと味違う」 は 97 件なので next_starts_any で分岐する。

[[case]]
input = "一味"
mode = "hiragana"
expected = "いちみ"

