# 2026-09-11 「帯」 default flip (タイ → おび) の全面退行ロック。
# 辞書内の 帯 を含む entry 49 件 + 実文脈 60 形を総当たり監査した結果を固定する。
# おび 側 (単独 / 訓 X帯 / 帯X) と タイ 側 (音 X帯 / 帯X) の両方を入れてある。

[[case]]
input = "帯"
mode = "hiragana"
expected = "おび"
note = "単漢字 default (2026-09-11 flip)"

