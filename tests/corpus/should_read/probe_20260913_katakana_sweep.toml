# 2026-09-13 「カタカナ語 + 単漢字」 の一括 sweep。
# overrides に 「前が漢字なら音読み」 rule があって 「前がカタカナ」 が無い漢字は 265 字。
# 一律に足すと 「イチゴ味」 系が壊れるので、 内部評価コーパスの用例を 3 件ずつ集めて
# VOICEVOX と突き合わせ、 証拠のあった 42 字を個別に判定して 10 字だけ採用した。
# ★酒 / 船 は不採用 = 長音符 「ー」 がカタカナ扱いなので 「あー酒が」 「おー船の」 が壊れる。
# ★体 は 「体を張る / 体張る」、 国 は 「ワノ国」 を先行 rule で除外している。

[[case]]
input = "グンマー国"
mode = "hiragana"
expected = "グンマーこく"

[[case]]
input = "ワノ国編"
mode = "hiragana"
expected = "ワノくにへん"

[[case]]
input = "この国"
mode = "hiragana"
expected = "このくに"

[[case]]
input = "レベル帯"
mode = "hiragana"
expected = "レベルたい"

[[case]]
input = "帯"
mode = "hiragana"
expected = "おび"

[[case]]
input = "プリン体"
mode = "hiragana"
expected = "プリンたい"

[[case]]
