# 2026-09-11 VOICEVOX 比較 (実コーパス 25,000 文) + 未登録 token 14,880 語の比較で検出。
# 複合助数詞 (試合/回戦/打席/打数/安打/三振/巡/順/球) を counter に登録したことで
# 「N<助数詞>目」 が recursive rule で正しく メ になる。
# ★球 だけは kanji_numeral=false (= 漢数字 bare 無効)。 四球=シキュウ を壊さないため。

[[case]]
input = "3試合目"
mode = "hiragana"
expected = "さんしあいめ"
note = "複合助数詞 (旧 さんしあいもく)"

