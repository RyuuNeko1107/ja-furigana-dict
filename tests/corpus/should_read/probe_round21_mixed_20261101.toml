# 2026-11-01 第 21 回 (実コメント / 国会 / livedoor の標本) の誤読。
# 判定者 (サブエージェント) の主張を、 現行 lib への引き直しと、 独立 2 系統 (UniDic / Sudachi) との照合で絞り、 一致したものだけを辞書に入れた。
# 最大の型は 米 + カタカナ = ベイ (アメリカ)。 実コメントで 269 行あり、 大半が こめメディア / こめトランプ と誤読していた。
# お米の語 (米コシヒカリ / 米パン / 米フレーク / 米デンプン …) は先に こめ で守る (kanji.match の next_starts_any)。

[[case]]
input = "米メディアが報じた"
mode = "hiragana"
expected = "べいメディアがほうじた"
note = "米 + カタカナ = べい (アメリカ。 旧: こめメディア)"

[[case]]
input = "米トランプ政権"
mode = "hiragana"
expected = "べいトランプせいけん"
note = "米 + カタカナ = べい"

