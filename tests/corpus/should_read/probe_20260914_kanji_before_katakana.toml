# 単漢字 + カタカナ語 (前置) の読み分け。
# ※ entry で読みを固定した語は hiragana mode でカタカナ部分もひらがな化される。
# 内部評価コーパスで 何 672 / 強 376 / 粉 108 / 出 111 件を確認して追加した rule の回帰ロック。

[[case]]
input = "強キャラ"
mode = "hiragana"
expected = "つよキャラ"

[[case]]
input = "強ボス"
mode = "hiragana"
expected = "つよボス"

