# 2026-11-01 第 20 回 (実コメント / 国会 / livedoor の標本) の誤読。
# 判定者 (サブエージェント) の主張を、 現行 lib への引き直しと、 独立 2 系統 (UniDic / Sudachi) との照合で絞り、 一致したものだけを辞書に入れた。
# 実コメントでも誤読していた語を優先した (愛おし 活用 / 美味え / 前 + 役職 / 前外相 / その方たち)。
# 入れなかったもの: 最中 (もなか と さいちゅう を文脈で読み分けている)、 人名の個別の読み、 文脈で割れる語 (傍から / 如何)。

[[case]]
input = "美味えな"
mode = "hiragana"
expected = "うめえな"
note = "美味え=うめえ (旧: びみえ。 実コメント 19 行)"

[[case]]
input = "豚しゃぶ美味え"
mode = "hiragana"
expected = "ぶたしゃぶうめえ"
note = "美味え=うめえ"

[[case]]
input = "その方たちのために"
mode = "hiragana"
expected = "そのかたたちのために"
note = "その方たち=そのかたたち (旧: そのほうたち)"

[[case]]
input = "愛おしそうに見つめた"
