# 2026-10-13 辛い (食べ物の話題は からい) / GW / 用紙サイズ / Lv

[[case]]
input = "辛い料理が好き"
mode = "hiragana"
expected = "からいりょうりがすき"
note = "食べ物の話題の文は からい"

[[case]]
input = "このラーメン辛い"
mode = "hiragana"
expected = "このラーメンからい"

[[case]]
input = "仕事が辛い"
mode = "hiragana"
expected = "しごとがつらい"
note = "食べ物の話題が無ければ つらい"

[[case]]
input = "GWの予定"
mode = "hiragana"
expected = "ゴールデンウィークのよてい"

[[case]]
input = "A4用紙"
mode = "hiragana"
expected = "エーヨンようし"

[[case]]
input = "Lv上げ周回"
mode = "hiragana"
expected = "レベルあげしゅうかい"

[[case]]
input = "何これ珍百景"
mode = "hiragana"
expected = "なにこれちんひゃっけい"
note = "何これ / 何それ は ナニ (話し言葉)"

[[case]]
input = "琵琶湖畔のホテル"
mode = "hiragana"
expected = "びわこはんのホテル"
note = "水辺の名詞 + 畔 = ハン"

[[case]]
