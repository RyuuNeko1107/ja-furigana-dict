# 2026-09-11 VV 比較 第 2 ラウンド (60,000 文)。 差分行と一致行での token 出現率を比べ、
# 「その語を含むとほぼ必ず食い違う」 語を統計的に特定して原因語を絞った。
# ★捕手: history.toml に 時代劇の トリテ で登録されていたため、 野球実況 4,325 行が誤読していた。
# ★田: prev 漢字 → ダ を追加。 未登録の姓 (蓑田/里田/梨田) が 「みのでん」 等になっていた。
#   水田/油田/炭田/塩田/美田/田園 は jukugo entry (band 1000) が勝つので影響なし。

[[case]]
input = "捕手"
mode = "hiragana"
expected = "ほしゅ"
note = "野球 (旧 トリテ = 時代劇語で登録されていた)"

[[case]]
input = "中村捕手"
mode = "hiragana"
expected = "なかむらほしゅ"
note = "同上"

[[case]]
input = "捕り手"
mode = "hiragana"
expected = "とりて"
note = "時代劇語は送り仮名つき表記で維持"

[[case]]
