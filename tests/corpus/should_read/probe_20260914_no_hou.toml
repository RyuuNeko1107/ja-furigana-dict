# 「名詞 + の方」 = ホウ と 動詞語幹 + 球 = ダマ の回帰。
# あの方 だけ人物の カタ が多数派なので entry、 あの方向 / あの方法 はその巻き添え防止。
# 球 は語幹と同じ仮名で終わる副詞 (さっき / 少し) があるので rule にしていない。

[[case]]
input = "上の方"
mode = "hiragana"
expected = "うえのほう"

[[case]]
input = "最初の方"
mode = "hiragana"
expected = "さいしょのほう"

[[case]]
input = "スイカの方"
mode = "hiragana"
expected = "スイカのほう"

