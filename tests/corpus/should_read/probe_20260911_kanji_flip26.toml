# 2026-09-11 単漢字 26 字の default flip (音 → 訓 + 「漢字隣接なら音」 char_type match)。
# 帯 / 身 と同型。 単独や 「この X」 「大きい X」 で音読みに落ちていたのを訓へ。
# 内部評価コーパス 28,284 行の A/B diff で副作用は 2 行のみ (どちらも改善方向) だった。
# 訓側と音側の両方を固定する。 風 は 「まさみ風 / アニソン風」 の接尾辞用法が主なので flip せず据え置き。

