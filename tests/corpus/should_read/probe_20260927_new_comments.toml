# 単独の 1 字名詞 (2026-10-01)
[[case]]
input = "埒が明かないので癇に障る"
expected = "らちがあかないのでかんにさわる"

[[case]]
input = "藻が生えた憩いの場で謡を謡う"
expected = "もがはえたいこいのばでうたいをうたう"

[[case]]
input = "ラフィド藻と休憩と海藻"
expected = "ラフィドそうときゅうけいとかいそう"

# 寺名 = じ / 旧国名 + 国 = のくに (Wikipedia の括弧読みで発見、 2026-10-01)
[[case]]
input = "常福寺と東禅寺と山寺と清水寺"
expected = "じょうふくじととうぜんじとやまでらときよみずでら"

[[case]]
input = "橋寺さんは下野国の出身"
expected = "はしでらさんはしもつけのくにのしゅっしん"

[[case]]
input = "上野国立博物館と妙高寺"
expected = "うえのこくりつはくぶつかんとみょうこうじ"

# 船名・幼名の X丸 = まる、 弾丸 / 砲丸 は がん (2026-10-01)
[[case]]
input = "浮島丸と梵天丸と弾丸と砲丸"
expected = "うきしままるとぼんてんまるとだんがんとほうがん"

# 神名 X命 / X尊 (Wikipedia の括弧読み、 2026-10-01)
[[case]]
input = "伊弉冉命と稚武彦命と国常立尊"
expected = "いざなみのみこととわかたけひこのみこととくにとこたちのみこと"

[[case]]
input = "生命と余命と中尊寺と保食神社"
expected = "せいめいとよめいとちゅうそんじとうけもちじんじゃ"

# X色 = いろ / X籠 = かご (2026-10-01)
[[case]]
input = "琥珀色の紙屑籠と染色と灯籠"
expected = "こはくいろのかみくずかごとせんしょくととうろう"

# Wikipedia の地名・山名・橋名 (2026-10-01)
[[case]]
input = "昌平橋と竹生島と足柄山と河原町通"
expected = "しょうへいばしとちくぶじまとあしがらやまとかわらまちどおり"

[[case]]
input = "東京都渋谷区の活火山と上野通子君"
expected = "とうきょうとしぶやくのかっかざんとうえのみちこくん"
