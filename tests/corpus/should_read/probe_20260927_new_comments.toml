input = "仙谷官房長官と逢沢議員"
expected = "せんごくかんぼうちょうかんとあいさわぎいん"

[[case]]
input = "椎葉さんと日高さん"
expected = "しいばさんとひだかさん"

# 歴史上の人名・中国の人名 (2026-10-01)
[[case]]
input = "唐の玄宗の時代の李鴻章"
expected = "とうのげんそうのじだいのりこうしょう"

[[case]]
input = "源氏は後白河法皇に"
expected = "げんじはごしらかわほうおうに"

[[case]]
input = "四世宗家と得宗家"
expected = "よんせいそうけととくそうけ"

