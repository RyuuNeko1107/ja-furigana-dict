# 2026-11-01 第 18 回 (Wikinews + 法令の標本) の誤読。
# 判定者 (サブエージェント) の主張を、 現行 lib への引き直しと、 独立 2 系統 (UniDic / Sudachi) との照合で絞り、 一致したものだけを辞書に入れた。
# ここは、 その語の回帰テストと、 「守る読み」 (新しい見出しが前の語を割っていないことの確認)。
# フック船 は フック船長 を割って壊したので取り下げた (その確認も守る読みに入れた)。

