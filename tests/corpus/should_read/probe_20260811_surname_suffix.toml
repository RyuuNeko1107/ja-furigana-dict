# 2026-08-11 姓 + 敬称/接尾辞 の suffix match (tools/gen_surname_suffix.py 生成分) 回帰 lock。
#
# 「大谷」「山中」「平野」 のように 姓が一般語と同形の場合、 姓読みを無条件 default に
# すると一般語用法を壊す (平野が広がる = へいや / 山中で迷う = さんちゅう)。
# default は一般語読みのまま、 敬称 / 人物接尾辞が後続する時だけ姓読みへ切り替える
# (= personal_names.toml の 御手洗 / 水田 と同じ形)。
#
# 両方向 (suffix あり = 姓読み / 無し = 一般語読み) を対で固定する。 片方だけだと
# 「default を姓読みに変えてしまう」 退行を検出できないため。

[[case]]
input = "大谷さんが来た"
mode = "hiragana"
expected = "おおたにさんがきた"
note = "姓 + 敬称 → 姓読み"

[[case]]
input = "大谷選手が打った"
mode = "hiragana"
expected = "おおたにせんしゅがうった"
note = "人物接尾辞 (選手) も姓読みの文脈"

[[case]]
input = "大谷を歩く"
mode = "hiragana"
expected = "おおやをあるく"
note = "suffix 無し → 一般語 (地名) 読みを維持"

[[case]]
input = "小谷さんが来た"
mode = "hiragana"
expected = "こたにさんがきた"
note = "姓 + 敬称 → 姓読み"

[[case]]
input = "山中で迷う"
mode = "hiragana"
expected = "さんちゅうでまよう"
note = "suffix 無し → 一般語読み (山中 = さんちゅう) を維持"

[[case]]
input = "平野が広がる"
mode = "hiragana"
expected = "へいやがひろがる"
note = "suffix 無し → 一般語読み (平野 = へいや) を維持"

[[case]]
input = "大木を切る"
mode = "hiragana"
expected = "たいぼくをきる"
note = "suffix 無し → 一般語読み (大木 = たいぼく) を維持"

# ── 第 2 弾 (seed 拡張 + 地名 kind 追加分) ──
# 一般語としても読める姓 / 地名。 suffix あり = 固有名詞読み、 無し = 一般語読み を対で固定。

[[case]]
input = "一色さんが来た"
mode = "hiragana"
expected = "いっしきさんがきた"
note = "一色 = イッシキ (一般語 いっしょく)"

[[case]]
input = "一色の服"
mode = "hiragana"
expected = "いっしょくのふく"
note = "suffix 無し → 一般語読み維持"

[[case]]
input = "根本から見直す"
mode = "hiragana"
expected = "こんぽんからみなおす"
note = "suffix 無し → 一般語読み維持"

[[case]]
input = "温水プールで泳ぐ"
mode = "hiragana"
expected = "おんすいプールでおよぐ"
note = "suffix 無し → 一般語読み維持"

[[case]]
input = "白鳥さんが来た"
mode = "hiragana"
expected = "しらとりさんがきた"
note = "白鳥 = シラトリ (鳥の名は はくちょう)"

[[case]]
input = "白鳥が飛ぶ"
mode = "hiragana"
expected = "はくちょうがとぶ"
note = "suffix 無し → 一般語読み維持"

[[case]]
input = "猪口さんが来た"
mode = "hiragana"
expected = "いのぐちさんがきた"
note = "猪口 = イノグチ (酒器は ちょく)"

[[case]]
input = "猪口で酒を飲む"
mode = "hiragana"
expected = "ちょくでさけをのむ"
note = "suffix 無し → 一般語読み維持"

[[case]]
input = "犬養さんが来た"
mode = "hiragana"
expected = "いぬかいさんがきた"
note = "犬養 = イヌカイ"

[[case]]
input = "長谷さんが来た"
mode = "hiragana"
expected = "はせさんがきた"
note = "長谷 = ハセ (default ながたに)"

[[case]]
input = "国立市に住む"
mode = "hiragana"
expected = "くにたちしにすむ"
note = "地名 kind: 国立 + 市 → クニタチ"

[[case]]
input = "国立競技場へ行く"
mode = "hiragana"
expected = "こくりつきょうぎじょうへいく"
note = "行政区画 suffix 以外は 一般語読み (こくりつ) を維持"

[[case]]
input = "放出駅で降りる"
mode = "hiragana"
expected = "はなてんえきでおりる"
note = "地名 kind: 放出 + 駅 → ハナテン"

[[case]]
input = "熱を放出する"
mode = "hiragana"
expected = "ねつをほうしゅつする"
note = "suffix 無し → 一般語読み (ほうしゅつ) を維持"

# ── 退行ロック: 姓 + 名 (敬称なし) の文脈 ──
# 一般語と同形の姓に jukugo entry を足すと、Lindera が人名として読めていた
# 「姓 + 名」 文脈まで一般語読みに固定される (山中伸弥 → さんちゅう… 等)。
# 実測でこの退行が出た 八木 / 大木 / 山中 / 平野 / 春日 / 根本 は entry を入れない
# 判断にしたので、その判断を lock する (= 将来 entry を足すと落ちる)。

[[case]]
input = "山中太郎が来た"
mode = "hiragana"
expected = "やまなかたろうがきた"
note = "姓 + 名 は Lindera の人名読みに任せる (entry を足すと さんちゅう に化ける)"

[[case]]
input = "平野太郎が来た"
mode = "hiragana"
expected = "ひらのたろうがきた"
note = "同上 (へいや 化け防止)"

[[case]]
input = "八木太郎が来た"
mode = "hiragana"
expected = "やぎたろうがきた"
note = "同上 (はちぼく 化け防止)"

[[case]]
input = "春日太郎が来た"
mode = "hiragana"
expected = "かすがたろうがきた"
note = "同上 (しゅんじつ 化け防止)"

[[case]]
input = "根本太郎が来た"
mode = "hiragana"
expected = "ねもとたろうがきた"
note = "同上 (こんぽん 化け防止)"

[[case]]
input = "大木太郎が来た"
mode = "hiragana"
expected = "おおきたろうがきた"
note = "同上 (たいぼく 化け防止)"

[[case]]
input = "温水太郎が来た"
mode = "hiragana"
expected = "ぬるみずたろうがきた"
note = "退行ロック: 温水 も EXCLUDED (entry を足すと おんすい に化ける)"
