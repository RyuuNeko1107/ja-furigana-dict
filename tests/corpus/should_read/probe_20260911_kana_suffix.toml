mode = "hiragana"
expected = "おとむらいきたぁ"
note = "同上"

[[case]]
input = "子供染みたさん"
mode = "hiragana"
expected = "こどもじみたさん"
note = "同上"

[[case]]
input = "幼けないこえぇ"
mode = "hiragana"
