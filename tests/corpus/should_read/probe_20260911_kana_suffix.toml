[[case]]
input = "お婆ちゃんすげぇ"
mode = "hiragana"
expected = "おばあちゃんすげぇ"
note = "lib fix: かな token 途中で終わる entry の継続 edge"

[[case]]
input = "お婆ちゃんやべぇ"
