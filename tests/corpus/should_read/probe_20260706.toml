# 2026-07-06 大/小/真/片/両/諸 接頭辞 例文 probe (r298-r300) で検出した実バグ回帰 lock。
#
# 1) 執筆 = シッピツ: literature.toml の連歌俳諧用語バッチ (2026-06-21) が
#    「執筆」(連歌の記録役、しゅひつ) を汎用語として登録してしまい、圧倒的に
#    多い現代語「執筆する」(しっぴつ) を上書きしていた。現代語読み優先で修正。
# 2) 諸刃の剣 = モロハノツルギ: 「剣」default はケンだが、この慣用句のみ古語訓
#    「つるぎ」。両刃造=モロハヅクリ (weapons.toml) の隣接語として general.toml に登録。
# 3) 小恥ずかしい = コッパズカシイ: 促音化した独立の形容詞語彙 (辞書見出し語)。
#    表記に「っ」が無くても発音は促音化する。
# 4) 小過 = ショウカ: 小康/小品/小宴/小社 と同系の「小+音読み熟語」語彙。単独の
#    「小」は訓 (こ) default のため、この種の語は個別 jukugo 登録が必要。

[[case]]
input = "彼は執筆に専念する"
mode = "hiragana"
expected = "かれはしっぴつにせんねんする"
note = "執筆=しっぴつ (誤登録シュヒツを修正)"

[[case]]
input = "彼は諸刃の剣を使う"
mode = "hiragana"
expected = "かれはもろはのつるぎをつかう"
note = "諸刃の剣=もろはのつるぎ (剣のdefaultケンを慣用句で上書き)"

[[case]]
input = "彼は小恥ずかしい思いをする"
mode = "hiragana"
expected = "かれはこっぱずかしいおもいをする"
note = "小恥ずかしい=こっぱずかしい (促音化)"

[[case]]
input = "彼は小過を許す"
mode = "hiragana"
expected = "かれはしょうかをゆるす"
note = "小過=しょうか (小康/小品と同系)"

[[case]]
input = "彼は大店を構える"
mode = "hiragana"
expected = "かれはおおだなをかまえる"
note = "大店=おおだな (江戸期の大商店、古典的用法)"

# 5) 腸が煮えくり返る = ハラワタガニエクリカエル: 「腸」 default はチョウだが、
#    この慣用句 (激怒の意) のみ古語訓「はらわた」。idioms.toml にフレーズ登録。
# 6) 細々 = 文脈分岐 (コマゴマ / ホソボソ): 「細々と暮らす/生きる/続ける/営む」 は
#    「ほそぼそ」 (慎ましく暮らす意)、それ以外の「細々と説明する」 等は default
#    「こまごま」。next_eq="と" + next2_starts_any で分岐。

[[case]]
input = "彼は腸が煮えくり返る"
mode = "hiragana"
expected = "かれははらわたがにえくりかえる"
note = "腸が煮えくり返る=はらわたがにえくりかえる (default チョウを慣用句で上書き)"

[[case]]
input = "彼は細々と暮らす"
mode = "hiragana"
expected = "かれはほそぼそとくらす"
note = "細々と暮らす=ほそぼそ (生活動詞への文脈分岐)"

[[case]]
input = "彼は細々と説明する"
mode = "hiragana"
expected = "かれはこまごまとせつめいする"
note = "細々と説明する=こまごま (default、非干渉の確認)"

# 7-10) 本番 raw_contexts 実データで発見した pronoun/false-positive 系4件:
# 7) 化 = カ default: 「初期化/自動化/合理化」等「-化」音読み熟語+「か」始まりの
#    助詞/助動詞 (から/かどうか/かもしれない) が続く極めて一般的な構造で、旧
#    next_starts_any=["か"]が「化ける/化かす」用法と誤衝突し「ば」に化けていた。
#    「かす/かし/かさ/かせ/かそ」(化かす活用形のみ)に絞って修正。
# 8) 私 = わたし default: 「今私は/昨日私も/次私か」等、kanji語+私(一人称代名詞)が
#    自然文で極めて多く、旧 prev_char_type=漢字→シ の broad match が誤爆していた。
#    「私立/私語/私見/私鉄/公私」等の音読み熟語は Lindera 側で別途正しく解決される
#    ため override 自体を削除。
# 9-10) 僕/君 = 同型バグだが「下僕/公僕」「太郎君/マリオ君」等の正当な接尾辞用法が
#    あるため override 削除はできず、代表的な副詞(今/次/昨日等)を prev_char_type
#    より先に評価される literal match として個別列挙し差し戻し。

[[case]]
input = "彼は初期化から始める"
mode = "hiragana"
expected = "かれはしょきかからはじめる"
note = "化=か (初期化+から、旧next_starts_any=[か]の誤爆を修正)"

[[case]]
input = "彼は自動化かもしれない"
mode = "hiragana"
expected = "かれはじどうかかもしれない"
note = "化=か (自動化+かもしれない)"

[[case]]
input = "狐が人を化かす"
mode = "hiragana"
expected = "きつねがひとをばかす"
note = "化かす=ばかす (活用形は引き続きバ、非干渉の確認)"

[[case]]
input = "彼は今私は無敵だと思う"
mode = "hiragana"
expected = "かれはいまわたしはむてきだとおもう"
note = "私=わたし (今+私、旧prev_char_type=漢字→シの誤爆を修正)"

[[case]]
input = "彼は私立大学に通う"
mode = "hiragana"
expected = "かれはしりつだいがくにかよう"
note = "私立=しりつ (override削除後もLindera側で正読、非干渉の確認)"

[[case]]
input = "彼は今僕は勉強する"
mode = "hiragana"
expected = "かれはいまぼくはべんきょうする"
note = "僕=ぼく (今+僕、副詞literal matchで差し戻し)"

[[case]]
input = "彼は下僕を従える"
mode = "hiragana"
expected = "かれはげぼくをしたがえる"
note = "下僕=げぼく (接尾辞用法は非干渉の確認)"

[[case]]
input = "彼は今君は無敵だと思う"
mode = "hiragana"
expected = "かれはいまきみはむてきだとおもう"
note = "君=きみ (今+君、副詞literal matchで差し戻し)"

[[case]]
input = "彼は太郎君と遊ぶ"
mode = "hiragana"
expected = "かれはたろうくんとあそぶ"
note = "太郎君=たろうくん (名前接尾辞用法は非干渉の確認)"
