# 2026-09-11 活用形監査 第4弾。 動詞 entry の連用形から派生語
# (〜方 / 〜過ぎ / 〜直す / 〜込む / 〜出す / 〜たて) を機械生成して検査した。
# 連用形名詞そのものが未登録だと派生語が丸ごと崩れる (咥え→テツエ / 淹れ→エンレ)。
# 「描き出す」 は エガキダス の方が自然なので登録しない。

[[case]]
input = "淹れたて"
mode = "hiragana"
expected = "いれたて"

