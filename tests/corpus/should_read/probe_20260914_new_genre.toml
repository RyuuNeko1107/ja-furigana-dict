# 2026-09-14 収集ジャンルを広げた後の新規テキストから。
# ★人: カタカナ語 + 人 = ジン (サイヤ人 831 / ブリタニア人 143 / アメリカ人 73)。
#   長音符 「ー」 もカタカナ文字種なので 「まぁー人が多い」 を先行 rule で除外する
#   (酒 / 船 で不採用にしたのと同じ罠。 今回は除外 rule を足して両立させた)。
# ケガ人 / ゼロ人 は ニン なので entry で固定。 かめはめ波 = カメハメハ。

[[case]]
input = "サイヤ人"
mode = "hiragana"
expected = "サイヤじん"

[[case]]
input = "超サイヤ人"
mode = "hiragana"
expected = "ちょうサイヤじん"

[[case]]
input = "アメリカ人"
mode = "hiragana"
expected = "アメリカじん"

[[case]]
input = "ブリタニア人"
mode = "hiragana"
expected = "ブリタニアじん"

