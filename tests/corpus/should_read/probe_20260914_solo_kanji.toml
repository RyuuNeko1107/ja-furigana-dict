# ひらがなに挟まれた単漢字 (= default 読みがそのまま出る位置) の読み分け。
# 者 = かな語 + 者 の モノ 読み漏れ、 粉 = 単独名詞 こな の default 反転。
# ※ entry で読みを固定した語は hiragana mode でカタカナ部分もひらがな化される。

[[case]]
input = "くせ者"
mode = "hiragana"
expected = "くせもの"

