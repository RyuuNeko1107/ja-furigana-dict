# 2026-10-12 精度検証 (Tatoeba 差分 + 実コメント 15 万件の差分) で見つけた誤判定の回帰ケース (lib 0.5.9 以降)。
# 笑いの w (助詞が続いても) / ガンダムW / 固有名詞を割らない / 機能語だけの英語は読まない / No.N の english10 など。

[[case]]
input = "軍服に見えるなぁwとは思ったよw"
mode = "hiragana"
expected = "ぐんぷくにみえるなぁワラとはおもったよワラ"

