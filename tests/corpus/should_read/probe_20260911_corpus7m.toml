# 2026-09-11 収集サーバ 704 万行から漢字 token を頻度抽出し、 未登録の上位 1,200 語を probe。
# 大半は正読で、 実バグは 7 件。 日本人 / 日本一 は 「日本=ニホン」 entry があるのに
# Lindera の 3 字熟語 token (band 150) が単漢字合成 (band 100) に勝って ニッポン に倒れていた。

[[case]]
input = "日本人"
mode = "hiragana"
expected = "にほんじん"
note = "704万行 token scan (旧 にっぽんじん)"

[[case]]
input = "日本一"
mode = "hiragana"
expected = "にほんいち"
note = "同上"

[[case]]
