# 2026-09-13 VOICEVOX 比較 第3巡。 無作為抽出が薄くなったので、
# 「dict entry の無い 3〜4 字漢字語を含む行」 に偏らせて 3,000 行採取 (一致 84.0%)。
# ★生: 漢字直後は接尾辞 セイ (候補生 / 女子高生)。 例外 (生配信 / 生主 / 生肉) は
#   文字種ではなく **語** で持つ = next_char_type で逃がすと 「3期生コラボ」 が壊れる。
# ★外: カタカナ直後も ガイ (ベンチ外 / スタメン外)。
# ★中押し entry の bracket が壊れていた ("[チュウオシ") のも併せて修復。

