# 2026-09-11 読み上げ BOT (zunda-rs) 誤読報告 (misreading_reports) 起点の probe。
# 麻雀部 Discord からの報告 9 件 + ついでの麻雀用語一括採録。
# 一般語と衝突する語 (平和/国士無双/清一色/天和/東風 単独) は据え置き = その据え置きも lock。

[[case]]
input = "麻雀部"
mode = "hiragana"
expected = "まーじゃんぶ"
note = "BOT 誤読報告 (旧 あさささべ)"

[[case]]
input = "麻雀部に入った"
mode = "hiragana"
expected = "まーじゃんぶにはいった"
note = "分割誤読の文脈 lock"

[[case]]
