# 2026-09-13 production signal_log の kanji_chunk (送り仮名付き 9,693 種) を
# VOICEVOX と突き合わせ。 1,500 種で不一致 66、 うち実バグ 4 件。
# ★正しく / を境に / の末に は **Lindera の compound token (band 150) に
#   単漢字 rule (band 100) が負ける** ので、 rule ではなく entry で押さえる必要があった。
# ★「公にする」 entry は 「主人公にする」 を ヌシヒトオオヤケニスル に壊すので不採用
#   (A/B で検出。 公 は prev_char_type = 漢字 → コウ の rule 側で守る)。

