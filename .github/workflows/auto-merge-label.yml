name: Auto-merge label

# PR が「safe な辞書追加」か判定して `auto-mergeable` label を付ける。
# 別 workflow (auto-merge.yml) が 48h 経過 + CI green の label 付き PR を
# scheduled で merge する。
#
# safe 条件:
# - **PR の作者がこの repo の関係者** (author_association が OWNER / MEMBER / COLLABORATOR)。
#   外部の人の PR は、 内容が core/ だけでも自動マージの対象にしない (維持者のレビューが要る)。
#   読みの差し替えは、 毎日の配布で本番の読み上げに届き、 配信上の事故になりうるため
#   (セキュリティ監査 REPORT-054)
# - 変更ファイルがすべて core/**/*.toml (語彙の追加)
#   workflow / script / docs / Cargo.toml 等 = 「重要な構成変更」 を含まない。
#   **rules/ も対象外**: 後処理の置換・型番の正規表現・手がかりの表・助数詞の規則など、
#   実行時の挙動を決めるデータで、 本番へ毎日配布される。 維持者のレビューを必須にする
#   (セキュリティ監査 REPORT-037)
# - 行追加 ≤ 200 行 (大量追加は人手 review 推奨)
# - 単漢字混入 / cross-file 重複は別の validate.yml ワークフローで CI fail として
#   検出されるため、ここでは file path + size のみチェック

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  classify:
    name: Safe PR を判定して label
    runs-on: ubuntu-latest
    steps:
      - name: PR の変更ファイル / 行数を取得
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --json files,additions,deletions \
            > pr.json
          cat pr.json

      - name: Safe 判定
        id: safe
        env:
          # PR の作者とこの repo との関係 (GitHub が付ける。 OWNER / MEMBER / COLLABORATOR / CONTRIBUTOR / FIRST_TIME_CONTRIBUTOR / NONE など)。
          # 式展開でシェルに入れず、 環境変数で受ける
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          ADDITIONS=$(jq -r '.additions' pr.json)
          UNSAFE_FILES=$(jq -r '
            .files[] | .path |
            select(startswith("core/") | not)
          ' pr.json)

          REASON=""
          case "$AUTHOR_ASSOC" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) REASON="PR の作者が repo の関係者ではない ($AUTHOR_ASSOC) — 維持者のレビューが要る" ;;
          esac
          if [ -n "$REASON" ]; then
            :
          elif [ -n "$UNSAFE_FILES" ]; then
            REASON="PR が語彙の領域 (core/) 外を変更 (rules/ は維持者のレビューが要る):"$'\n'"$UNSAFE_FILES"
          elif [ "$ADDITIONS" -gt 200 ]; then
            REASON="PR の行追加が 200 を超える ($ADDITIONS 行) — 人手 review 推奨"
          fi

          if [ -z "$REASON" ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            echo "PR is safe ($ADDITIONS additions, core/ only)"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "$REASON"
          fi

      - name: Label を付ける (safe なら)
        if: steps.safe.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUM" --repo "${{ github.repository }}" --add-label auto-mergeable

      - name: Label を外す (safe でなくなったら)
        if: steps.safe.outputs.safe != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUM" --repo "${{ github.repository }}" --remove-label auto-mergeable || true
