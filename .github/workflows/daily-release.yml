name: Daily auto-release

# **RESUMED: 2026-05-12 (= ja-furigana lib v0.1.0 stable cut 後)**
#
# alpha era は dict / lib の schema 不整合が起こりやすく停止していたが、
# lib v0.1.0 stable + dict v0.1.0 coordinated 後は schema 互換 SemVer 維持、
# daily auto-cut の coordination cost が下がったので再開。
#
# 1 日 1 回 (JST 03:00 / UTC 18:00) 起動。
# 前回 tag 以降に core/ または rules/ への変更が 1 件以上あれば、
# その日の date で CalVer tag を打つ → 既存 release.yml が
# tag push を catch して tar.gz + sha256 を GitHub Release に upload する。
#
# tag 形式: vYYYY.MM.DD (例: v2026.05.08)、同日 2 回目以降は v2026.05.08.1 / .2 …
#
# auto-commit (`chore: dedup compat + regen STATS [skip stats]`) は中身 (辞書 entry)
# の変更ではないので、 差分判定からは除外する。 `[skip stats]` tag の grep だけで
# fallback 上は十分だが、 念のため commit message prefix もマッチさせる。

on:
  schedule:
    # UTC 15:00 = JST 00:00。 GitHub の schedule は実測 2〜3 時間遅れて走る (JST 03:00 設定で 05:30〜06:20 実行)ため、
    # 本番 wrapper の取り込み (毎日 JST 05:00) に間に合うよう早めた (2026-09-24。 旧: '0 18 * * *' = JST 03:00)
    - cron: '0 15 * * *'
  workflow_dispatch:        # 手動トリガー (緊急 release / 即時 cut 用)

permissions:
  contents: write

jobs:
  maybe-release:
    name: 差分があれば日付 tag を打つ
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # **GITHUB_TOKEN 固定** (2026-09-11)。 以前は RELEASE_PAT 経由で tag push し、
          # recursive workflow 制限 (= GITHUB_TOKEN の push は他 workflow を起動しない) を
          # 回避していたが、 PAT 失効で checkout ごと落ちて daily release が 1 ヶ月停止した。
          # 現在は tag push 後に release.yml を **明示 call** するので PAT は不要。
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 前回 tag を解決
        id: last
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Last tag: $LAST_TAG"

      - name: core/ rules/ の変更を確認 (auto-commit は除外)
        id: diff
        run: |
          LAST_TAG="${{ steps.last.outputs.tag }}"
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
          fi
          CHANGES=$(git log "$RANGE" --pretty='%H %s' -- core/ rules/ \
            | grep -v '\[skip stats\]' \
            | grep -v 'chore: dedup compat + regen STATS' \
            || true)
          if [ -z "$CHANGES" ]; then
            echo "No content changes in core/ or rules/ since $LAST_TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes since $LAST_TAG:"
            echo "$CHANGES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 次の CalVer tag を計算 (vYYYY.MM.DD、同日複数なら .N suffix)
        if: steps.diff.outputs.skip != 'true'
        id: next
        run: |
          # JST date を使う (cron は JST 00:00 起動 + 遅延 2〜3 時間なので、 実行時の JST 日付 = その日の date)
          TODAY=$(TZ=Asia/Tokyo date +%Y.%m.%d)
          BASE="v${TODAY}"
          # 同日に既に release が打たれていたら .N suffix で衝突回避
          if ! git rev-parse "$BASE" >/dev/null 2>&1; then
            NEXT="$BASE"
          else
            i=1
            while git rev-parse "${BASE}.${i}" >/dev/null 2>&1; do
              i=$((i + 1))
            done
            NEXT="${BASE}.${i}"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEXT"

      - name: tag を打って push
        if: steps.diff.outputs.skip != 'true'
        run: |
          NEXT="${{ steps.next.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 既存の release.yml workflow が tag push を catch して
          # tar.gz + sha256 を GitHub Release に upload する。
          git tag -a "$NEXT" -m "$NEXT (daily auto-release)"
          git push origin "$NEXT"

  # tag push (GITHUB_TOKEN) は release.yml の push trigger を起動しないため、
  # ここから reusable workflow として明示的に呼ぶ。
  release:
    name: Release を作る
    needs: maybe-release
    if: needs.maybe-release.outputs.skip != 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.maybe-release.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
