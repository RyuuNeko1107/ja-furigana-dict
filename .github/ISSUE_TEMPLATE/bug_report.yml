name: バグ報告 / 既存エントリの誤読
description: 既存エントリの読みが間違っている / フォーマット問題等
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        修正 PR を直接出せるならそちらが速いです (該当ファイルを GitHub Web UI で編集 → Commit changes → PR)。
        詳細は [CONTRIBUTING.md](../../blob/master/CONTRIBUTING.md) を参照。
  - type: textarea
    id: description
    attributes:
      label: 何が起きてる?
      placeholder: |
        例: core/jukugo/basic/general.toml の「灰桜」が「ハイザクラ」になっているが
        正しくは「ハイサクラ」(濁点なし) では?
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: 該当 surface (表記)
      placeholder: "灰桜"
  - type: input
    id: current
    attributes:
      label: 現在の読み
      placeholder: "ハイザクラ"
  - type: input
    id: proposed
    attributes:
      label: 提案する読み
      placeholder: "ハイサクラ"
  - type: dropdown
    id: file
    attributes:
      label: 該当ファイル
      options:
        - core/jukugo/basic/*.toml (一般熟語 / 四字熟語)
        - core/jukugo/<分野>/*.toml (nature / objects / humanities / society の分野別熟語、 地名は nature/place_names.toml)
        - core/jukugo/proper/*.toml (人名 / 姓 / 固有名詞)
        - core/works/*/*.toml (アニメ / ゲーム / 文学 / VTuber の作品固有名)
        - core/kanji/overrides.toml (単漢字の文脈ルール)
        - core/unihan/*.toml (単漢字フォールバック)
        - core/loanwords/*.toml (英字表記の外来語)
        - core/_inbox.toml (振り分け前の一時置き場)
        - rules/compat.toml (異体字)
        - rules/numbers/counters/*.toml (助数詞)
        - rules/numbers/*.toml (日付 / 大数 / 数字を含む例外語句)
        - rules/text/*.toml (記号 / 単位 / 後処理)
        - わからない / 該当なし
  - type: textarea
    id: reference
    attributes:
      label: 出典・確認方法
      placeholder: "例: 国会図書館蔵書「○○」p.42 / Wikipedia / 公式サイト URL"
