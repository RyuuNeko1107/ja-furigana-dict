name: 読みの追加・修正提案
description: 「この単語の読みを追加 / 修正してほしい」という提案
labels: ["reading-request"]
body:
  - type: markdown
    attributes:
      value: |
        **PR を直接出せる方は、該当ファイルを直接編集して PR を投げる方が速いです** (このフォームより)。
        - 判断に迷う語: [`core/_inbox.toml`](../../blob/master/core/_inbox.toml) (振り分け前の一時置き場)
        - 分野別の熟語: [`core/jukugo/`](../../tree/master/core/jukugo) (basic / nature / objects / humanities / society / proper)
        - 作品固有名 (アニメ / ゲーム / VTuber 等): [`core/works/`](../../tree/master/core/works)
        - 単漢字の文脈ルール: [`core/kanji/overrides.toml`](../../blob/master/core/kanji/overrides.toml)
        - 異体字: [`rules/compat.toml`](../../blob/master/rules/compat.toml)

        詳細は [CONTRIBUTING.md](../../blob/master/CONTRIBUTING.md) を参照。
  - type: input
    id: surface
    attributes:
      label: 表層 (漢字)
      placeholder: "灰桜"
    validations:
      required: true
  - type: input
    id: reading
    attributes:
      label: 読み (ひらがな または 全角カタカナ)
      placeholder: "ハイザクラ / はいざくら"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由 / 出典 (任意)
      placeholder: |
        例: 配信で読み上げ時に「ハイ・サクラ」と棒読みになってしまう。
        辞書: 大辞林 第三版 / 自作品の固有名詞 / 等
  - type: dropdown
    id: file
    attributes:
      label: 追加先ファイル (判断に迷えば core/_inbox.toml で OK、レビューで振り分けます)
      options:
        - core/_inbox.toml (判断に迷う語。 レビューで振り分け)
        - core/jukugo/<分野>/*.toml (nature / objects / humanities / society の分野別熟語、 地名は nature/place_names.toml)
        - core/jukugo/basic/four_char.toml (四字熟語)
        - core/jukugo/proper/*.toml (人名 / 姓 / 固有名詞)
        - core/works/*/*.toml (アニメ / ゲーム / 文学 / VTuber の作品固有名)
        - core/kanji/overrides.toml (単漢字の文脈ルール)
        - rules/compat.toml (異体字 → 標準字)
        - rules/numbers/numeric_phrases.toml (数字を含む例外語句: 二十歳→ハタチ等)
        - わからない / 該当なし
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: テスト文 (任意)
      placeholder: |
        その語を含む短い例文があると、レビュアーが「このテキストでこの読みになる」を確認しやすいです。
        例: 「灰桜の散る道を歩いた」
